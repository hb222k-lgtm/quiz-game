<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="탐험퀴즈">
  <title>상점 - 탐험 퀴즈 게임</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    .item-grid { padding: 16px; display: grid; gap: 12px; }
    .item-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      transition: all 0.18s;
    }
    .item-card:hover { box-shadow: var(--shadow); border-color: var(--primary-lt); }
    .item-emoji {
      font-size: 42px; width: 60px; height: 60px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg2); border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-weight: 800; font-size: 15px; margin-bottom: 2px; color: var(--text); }
    .item-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { display: flex; align-items: center; gap: 8px; }
    .item-price {
      font-weight: 900; font-size: 14px;
      background: var(--grad-gold);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .item-stock { font-size: 11px; color: var(--text-muted); font-weight: 600; background: var(--bg); padding: 2px 8px; border-radius: 99px; }
    .shop-header-back {
      background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.3);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .team-badge {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 10px; border-radius:99px;
      font-size:11px; font-weight:800;
    }
    .team-item-leader-btns {
      display:flex; gap:6px; margin-top:8px;
    }
    .team-item-leader-btn {
      padding:5px 10px; border:none; border-radius:8px;
      font-size:12px; font-weight:700; cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="full-page">
    <!-- 헤더 -->
    <div class="shop-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="shop-header-back" onclick="window.location.href='map.html'">←</button>
        <h2>🛒 상점</h2>
      </div>
      <div class="my-points">⭐ <span id="my-points">0</span>점</div>
    </div>

    <!-- 탭 -->
    <div class="shop-tabs">
      <button class="shop-tab active" onclick="switchShopTab('items', this)">상품 목록</button>
      <button class="shop-tab" id="team-shop-tab" style="display:none;" onclick="switchShopTab('team', this)">🏷️ 팀 상점</button>
      <button class="shop-tab" onclick="switchShopTab('history', this)">내 구매 내역</button>
    </div>

    <!-- 상품 목록 -->
    <div class="tab-content active" id="tab-items" style="flex:1; overflow-y:auto;">
      <div class="item-grid" id="item-grid">
        <div class="empty-msg">상품을 불러오는 중...</div>
      </div>
    </div>

    <!-- 팀 상점 -->
    <div class="tab-content" id="tab-team" style="flex:1; overflow-y:auto; display:none;">
      <div style="padding:14px 16px 4px; display:flex; align-items:center; justify-content:space-between;">
        <div id="team-shop-label" style="font-size:14px; font-weight:800; color:#374151;"></div>
        <button id="add-team-item-btn" style="display:none;
          background:#7c3aed; color:#fff; border:none; border-radius:10px;
          padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;">+ 상품 추가</button>
      </div>
      <div style="padding:0 16px 8px;">
        <div id="team-cost-info" style="font-size:12px; color:#7c3aed; font-weight:600; background:#f5f3ff; padding:8px 12px; border-radius:10px; display:none;">
          💡 팀 구매는 결제 시점의 팀원 수에 따라 1인당 비용이 나뉘어 자동 차감돼요
        </div>
      </div>
      <div class="item-grid" id="team-item-grid">
        <div class="empty-msg">팀 상품이 없어요</div>
      </div>
    </div>

    <!-- 구매 내역 -->
    <div class="tab-content" id="tab-history" style="flex:1; overflow-y:auto; padding:16px;">
      <div id="history-list"><div class="empty-msg">구매 내역이 없어요</div></div>
    </div>
  </div>

  <!-- 팀 구매 확인 모달 -->
  <div class="modal-overlay" id="team-buy-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeTeamModal()">✕</button>
      <h3>팀 구매 확인</h3>
      <div style="text-align:center; padding:12px 0 8px;">
        <div id="tbm-emoji" style="font-size:52px; margin-bottom:10px;"></div>
        <div id="tbm-name" style="font-size:17px; font-weight:800; margin-bottom:4px;"></div>
        <div id="tbm-desc" style="font-size:13px; color:#64748b; margin-bottom:14px;"></div>
      </div>
      <div style="background:#f5f3ff; border-radius:14px; padding:14px 16px; margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:13px; color:#64748b; font-weight:600;">총 상품 가격</span>
          <span id="tbm-total" style="font-size:14px; font-weight:800; color:#7c3aed;"></span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:13px; color:#64748b; font-weight:600;">현재 팀원 수</span>
          <span id="tbm-members" style="font-size:14px; font-weight:800;"></span>
        </div>
        <div style="height:1px; background:#e2d9f3; margin-bottom:8px;"></div>
        <div style="display:flex; justify-content:space-between;">
          <span style="font-size:14px; font-weight:700;">내가 낼 금액</span>
          <span id="tbm-per" style="font-size:18px; font-weight:900; color:#7c3aed;"></span>
        </div>
      </div>
      <div style="font-size:12px; color:#94a3b8; text-align:center; margin-bottom:12px;">
        보유: <span id="tbm-mypts"></span>점 → 구매 후: <span id="tbm-after"></span>점
      </div>
      <button class="btn" id="tbm-confirm-btn"
        style="background:#7c3aed; color:#fff; font-weight:700;" onclick="confirmTeamBuy()">
        팀 전체 구매하기
      </button>
    </div>
  </div>


  <!-- 구매 확인 모달 -->
  <div class="modal-overlay" id="buy-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>구매 확인</h3>
      <div style="text-align:center; padding:16px 0;">
        <div id="modal-emoji" style="font-size:56px; margin-bottom:12px;"></div>
        <div id="modal-name" style="font-size:18px; font-weight:700; margin-bottom:6px;"></div>
        <div id="modal-desc" style="font-size:14px; color:#64748b; margin-bottom:16px;"></div>
        <div style="font-size:22px; font-weight:800; color:#7c3aed;" id="modal-price"></div>
        <div style="font-size:13px; color:#94a3b8; margin-top:4px;">
          보유: <span id="modal-mypoints"></span>점 → 구매 후: <span id="modal-after"></span>점
        </div>
      </div>
      <button class="btn" style="background:#7c3aed; color:#fff; font-weight:700;" onclick="confirmBuy()">
        구매하기
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script>
    const nickname = getNickname();
    if (!nickname) { window.location.href = 'index.html'; }

    let myPoints = 0;
    let pendingItem = null;

    // ── 팀 상점 관련 상태 ─────────────────────────
    let myTeamId        = null;
    let myTeamData      = null;
    let teamItemsData   = [];
    let teamMemberCount = 0;
    let pendingTeamItem = null;

    // ── 탭 전환 ──────────────────────────────────
    function switchShopTab(id, btn) {
      document.querySelectorAll('.tab-content').forEach(t => {
        t.classList.remove('active');
        t.style.display = 'none';
      });
      document.querySelectorAll('.shop-tab').forEach(b => b.classList.remove('active'));
      const tabEl = document.getElementById('tab-' + id);
      tabEl.classList.add('active');
      tabEl.style.display = 'flex';
      tabEl.style.flexDirection = 'column';
      btn.classList.add('active');
    }

    // ── 참가자 실시간 ─────────────────────────────
    function listenParticipant() {
      if (!nickname) return;
      db.collection('participants').doc(nickname).onSnapshot(snap => {
        if (!snap.exists) return;
        const d = snap.data();
        myPoints = d.points || 0;
        document.getElementById('my-points').textContent = myPoints;
        // 팀 변경 감지
        const newTeamId = d.team || null;
        if (newTeamId !== myTeamId) {
          myTeamId = newTeamId;
          loadTeamInfo();
        }
        renderItems();
        renderTeamItems();
      });
    }

    // ── 팀 정보 로드 ──────────────────────────────
    async function loadTeamInfo() {
      const tab    = document.getElementById('team-shop-tab');
      const costEl = document.getElementById('team-cost-info');
      const addBtn = document.getElementById('add-team-item-btn');

      if (!myTeamId) {
        tab.style.display = 'none';
        costEl.style.display = 'none';
        addBtn.style.display = 'none';
        myTeamData = null;
        return;
      }

      try {
        const snap = await db.collection('config').doc('teamMode').get();
        const tm = snap.data();
        myTeamData = (tm?.teams || []).find(t => t.id === myTeamId) || null;
        tab.style.display = 'block';
        costEl.style.display = 'block';

        const label = document.getElementById('team-shop-label');
        if (myTeamData) {
          label.innerHTML = `<span style="color:${myTeamData.color||'#7c3aed'}; font-size:18px;">${myTeamData.emoji||'🏆'}</span> ${escHtml(myTeamData.name)} 팀 상점`;
        } else {
          label.innerHTML = '🏷️ 팀 상점';
        }

        addBtn.style.display = 'none';

        // 팀원 수 로드
        const membersSnap = await db.collection('participants').where('team', '==', myTeamId).get();
        teamMemberCount = membersSnap.size;

        // 팀 상품 실시간 구독
        listenTeamItems();
      } catch(e) {
        console.warn('팀 정보 로드 오류:', e);
      }
    }

    // ── 팀 상품 실시간 구독 ───────────────────────
    let _teamItemsUnsubscribe = null;
    function listenTeamItems() {
      if (_teamItemsUnsubscribe) { _teamItemsUnsubscribe(); _teamItemsUnsubscribe = null; }
      if (!myTeamId) return;
      _teamItemsUnsubscribe = db.collection('team_shop_items')
        .onSnapshot(snap => {
          teamItemsData = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(i => i.enabled !== false);
          renderTeamItems();
        }, e => console.warn('팀 상품 로드 오류:', e));
    }

    // ── 팀 상품 렌더링 ────────────────────────────
    function renderTeamItems() {
      const grid = document.getElementById('team-item-grid');
      if (!grid) return;
      if (!myTeamId) { grid.innerHTML = '<div class="empty-msg">팀에 참여해야 이용할 수 있어요</div>'; return; }
      if (teamItemsData.length === 0) {
        grid.innerHTML = '<div class="empty-msg">등록된 팀 상품이 없어요</div>';
        return;
      }

      const perCount = teamMemberCount || 1;
      grid.innerHTML = teamItemsData.map(item => {
        const perCost = Math.ceil(item.price / perCount);
        const soldOut = item.stock === 0;
        const cantAfford = myPoints < perCost;
        const disabled = soldOut || cantAfford;
        const stockTxt = item.stock < 0 ? '무제한' : `남은 수량 ${item.stock}개`;
        let btnText = '팀 구매';
        if (soldOut) btnText = '품절';
        else if (cantAfford) btnText = '포인트 부족';

        return `
          <div class="item-card">
            <div class="item-emoji">${item.emoji || '🎁'}</div>
            <div class="item-info">
              <div class="item-name">${escHtml(item.name)}</div>
              <div class="item-desc">${escHtml(item.description || '')}</div>
              <div class="item-meta">
                <span class="item-price">⭐ 총 ${item.price}점</span>
                <span class="item-stock">${stockTxt}</span>
              </div>
              <div style="font-size:12px; color:#7c3aed; font-weight:700; margin-top:4px;">
                팀원 ${perCount}명 → 1인당 ${perCost}점
              </div>
            </div>
            <button class="buy-btn" ${disabled ? 'disabled' : ''}
              onclick="openTeamBuyModal('${item.id}')">${btnText}</button>
          </div>`;
      }).join('');
    }

    // ── 팀 구매 모달 열기 ─────────────────────────
    async function openTeamBuyModal(itemId) {
      const item = teamItemsData.find(i => i.id === itemId);
      if (!item) return;

      // 최신 팀원 수 다시 조회
      try {
        const snap = await db.collection('participants').where('team', '==', myTeamId).get();
        teamMemberCount = snap.size;
      } catch(e) {}

      const perCost = Math.ceil(item.price / (teamMemberCount || 1));
      pendingTeamItem = { ...item, perCost, memberCount: teamMemberCount };

      document.getElementById('tbm-emoji').textContent   = item.emoji || '🎁';
      document.getElementById('tbm-name').textContent    = item.name;
      document.getElementById('tbm-desc').textContent    = item.description || '';
      document.getElementById('tbm-total').textContent   = `⭐ ${item.price}점`;
      document.getElementById('tbm-members').textContent = `${teamMemberCount}명`;
      document.getElementById('tbm-per').textContent     = `⭐ ${perCost}점`;
      document.getElementById('tbm-mypts').textContent   = myPoints;
      document.getElementById('tbm-after').textContent   = myPoints - perCost;

      const confirmBtn = document.getElementById('tbm-confirm-btn');
      if (myPoints < perCost) {
        confirmBtn.disabled = true;
        confirmBtn.textContent = '포인트 부족';
      } else {
        confirmBtn.disabled = false;
        confirmBtn.textContent = '팀 전체 구매하기';
      }

      document.getElementById('team-buy-modal').classList.add('visible');
    }

    function closeTeamModal() {
      document.getElementById('team-buy-modal').classList.remove('visible');
      pendingTeamItem = null;
    }

    // ── 팀 구매 실행 (1/n 차감) ───────────────────
    async function confirmTeamBuy() {
      if (!pendingTeamItem) return;
      const item = pendingTeamItem;
      closeTeamModal();

      try {
        // 최신 팀원 목록 조회
        const membersSnap = await db.collection('participants').where('team', '==', myTeamId).get();
        const members = membersSnap.docs;
        const count = members.length;
        const perCost = Math.ceil(item.price / count);

        if (myPoints < perCost) { showToast('포인트가 부족해요'); return; }

        // 트랜잭션: 재고 확인 + 팀원 전체 차감
        await db.runTransaction(async tx => {
          const iRef = db.collection('team_shop_items').doc(item.id);
          const memberRefs = members.map(m => m.ref);
          const [iSnap, ...memberSnaps] = await Promise.all([tx.get(iRef), ...memberRefs.map(r => tx.get(r))]);

          if (!iSnap.exists) throw new Error('상품이 없어요');
          if (iSnap.data().stock === 0) throw new Error('품절된 상품이에요');

          // 포인트 부족 팀원 체크
          const poor = memberSnaps.find(s => (s.data()?.points || 0) < perCost);
          if (poor) throw new Error(`${poor.data()?.nickname} 님 포인트 부족 (필요: ${perCost}점)`);

          // 전원 차감
          memberSnaps.forEach(s => {
            tx.update(s.ref, { points: firebase.firestore.FieldValue.increment(-perCost) });
          });
          // 재고 감소
          if (iSnap.data().stock > 0) {
            tx.update(iRef, { stock: firebase.firestore.FieldValue.increment(-1) });
          }
        });

        // 주문 기록 (구매자 기준)
        const orderData = {
          nickname,
          itemId:      item.id,
          itemName:    item.name,
          emoji:       item.emoji || '🎁',
          price:       perCost,
          totalPrice:  item.price,
          teamOrder:   true,
          teamId:      myTeamId,
          memberCount: count,
          confirmed:   false,
          purchasedAt: new Date().toISOString(),
        };
        db.collection('orders').add(orderData).catch(() =>
          setTimeout(() => db.collection('orders').add(orderData).catch(() => {}), 2000)
        );

        showToast(`🎉 팀 구매 완료! ${count}명이 각 ${perCost}점씩 차감됐어요`);
      } catch(e) {
        showToast(e.message || '팀 구매에 실패했어요');
      }
    }


    // ── 내 주문 내역 실시간 ───────────────────────
    let myOrders = [];
    function listenMyOrders() {
      if (!nickname) return;
      db.collection('orders')
        .where('nickname', '==', nickname)
        .onSnapshot(snap => {
          myOrders = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.purchasedAt || '') < (a.purchasedAt || '') ? 1 : -1); // 최신순
          renderHistory();
          renderItems(); // 구매완료 버튼 상태 갱신
        });
    }

    // ── 상품 목록 실시간 ──────────────────────────
    let itemsData = [];
    function listenItems() {
      db.collection('shop_items').onSnapshot(snap => {
        itemsData = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(i => i.enabled);
        renderItems();
      });
    }

    function renderItems() {
      const grid = document.getElementById('item-grid');
      if (itemsData.length === 0) {
        grid.innerHTML = '<div class="empty-msg">🛍️ 등록된 상품이 없어요</div>';
        return;
      }
      grid.innerHTML = itemsData.map(item => {
        const soldOut = item.stock === 0;
        const alreadyBought = myOrders.some(o => o.itemId === item.id && !o.isGift); // 선물 받은 건 제외
        const cantAfford = myPoints < item.price;
        const disabled = soldOut || alreadyBought || cantAfford;
        const stockTxt = item.stock < 0 ? '무제한' : `남은 수량 ${item.stock}개`;
        let btnText = '구매';
        let btnClass = 'buy-btn';
        if (soldOut) { btnText = '품절'; }
        else if (alreadyBought) { btnText = '구매 완료'; }
        else if (cantAfford) { btnText = '포인트 부족'; }

        return `
          <div class="item-card">
            <div class="item-emoji">${item.emoji || '🎁'}</div>
            <div class="item-info">
              <div class="item-name">${escHtml(item.name)}</div>
              <div class="item-desc">${escHtml(item.description || '')}</div>
              <div class="item-meta">
                <span class="item-price">⭐ ${item.price}점</span>
                <span class="item-stock">${stockTxt}</span>
              </div>
            </div>
            <button class="${btnClass}" ${disabled ? 'disabled' : ''}
              onclick="openBuyModal('${item.id}')">
              ${btnText}
            </button>
          </div>`;
      }).join('');
    }

    // ── 구매 내역 ─────────────────────────────────
    function renderHistory() {
      const el = document.getElementById('history-list');
      if (!myOrders.length) {
        el.innerHTML = '<div class="empty-msg">아직 구매한 상품이 없어요</div>';
        return;
      }
      el.innerHTML = myOrders.map(o => {
        const time = o.purchasedAt ? new Date(o.purchasedAt).toLocaleString('ko-KR') : '';
        const isGift = o.isGift && o.giftFrom;
        const giftLabel = isGift
          ? `<span style="font-size:11px; background:#fdf4ff; color:#a855f7; padding:2px 8px; border-radius:10px; font-weight:600; margin-right:4px;">🎁 ${escHtml(o.giftFrom)}님의 선물</span>`
          : '';

        const isTeamOrder = o.teamOrder;
        const teamLabel = isTeamOrder
          ? `<span style="font-size:11px; background:#f5f3ff; color:#7c3aed; padding:2px 8px; border-radius:10px; font-weight:600; margin-right:4px;">🏷️ 팀 구매 (${o.memberCount}명)</span>`
          : '';
        const priceLabel = isGift ? '선물' : isTeamOrder ? `-${o.price}점 (1인 분담)` : `-${o.price}점`;

        if (o.confirmed) {
          return `
            <div class="purchase-row">
              <div>
                <div class="item-n">${o.emoji || '🎁'} ${escHtml(o.itemName)}</div>
                <div style="margin-top:3px; display:flex; flex-wrap:wrap; gap:4px;">
                  ${teamLabel}${giftLabel}
                  <span style="font-size:11px; background:#dcfce7; color:#15803d; padding:2px 8px; border-radius:10px; font-weight:600;">✅ 수령 완료</span>
                </div>
                <div style="font-size:12px; color:#94a3b8; margin-top:2px;">${time}</div>
              </div>
              <div class="item-p">${priceLabel}</div>
            </div>`;
        } else {
          return `
            <div class="purchase-row" style="border-left:3px solid ${isGift ? '#a855f7' : isTeamOrder ? '#7c3aed' : '#f59e0b'}; padding-left:13px;">
              <div style="flex:1;">
                <div class="item-n">${o.emoji || '🎁'} ${escHtml(o.itemName)}</div>
                <div style="margin-top:3px; display:flex; flex-wrap:wrap; gap:4px;">
                  ${teamLabel}${giftLabel}
                  <span style="font-size:11px; background:#fef9c3; color:#854d0e; padding:2px 8px; border-radius:10px; font-weight:600;">🕐 수령 대기</span>
                </div>
                <div style="font-size:12px; color:#94a3b8; margin-top:2px;">${time}</div>
                <button data-order-id="${o.id}" onclick="confirmReceived(this.dataset.orderId)"
                  style="margin-top:8px; background:#7c3aed; color:#fff; border:none; border-radius:8px;
                         padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer; display:block;">
                  ✅ 수령 완료
                </button>
              </div>
              <div class="item-p">${priceLabel}</div>
            </div>`;
        }
      }).join('');
    }

    async function confirmReceived(orderId) {
      if (!confirm('판매자에게 상품을 받으셨나요?\n수령 완료로 변경하면 되돌릴 수 없어요.')) return;
      await db.collection('orders').doc(orderId).update({
        confirmed: true,
        confirmedAt: new Date().toISOString(),
      });
      showToast('수령 완료 처리됐어요 🎉');
    }

    // ── 구매 모달 ─────────────────────────────────
    function openBuyModal(itemId) {
      const item = itemsData.find(i => i.id === itemId);
      if (!item) return;
      pendingItem = item;
      document.getElementById('modal-emoji').textContent   = item.emoji || '🎁';
      document.getElementById('modal-name').textContent    = item.name;
      document.getElementById('modal-desc').textContent    = item.description || '';
      document.getElementById('modal-price').textContent   = `⭐ ${item.price}점`;
      document.getElementById('modal-mypoints').textContent = myPoints;
      document.getElementById('modal-after').textContent   = myPoints - item.price;
      document.getElementById('buy-modal').classList.add('visible');
    }

    function closeModal() {
      document.getElementById('buy-modal').classList.remove('visible');
      pendingItem = null;
    }

    async function confirmBuy() {
      if (!pendingItem) return;
      const item = pendingItem;
      closeModal();

      if (myPoints < item.price) { showToast('포인트가 부족해요'); return; }
      if (item.stock === 0)      { showToast('품절된 상품이에요'); return; }

      try {
        // 트랜잭션으로 재고·포인트 원자적 처리 (동시 구매 race condition 방지)
        let finalPrice = item.price;
        await db.runTransaction(async tx => {
          const iRef  = db.collection('shop_items').doc(item.id);
          const pRef  = db.collection('participants').doc(nickname);
          const [iSnap, pSnap] = await Promise.all([tx.get(iRef), tx.get(pRef)]);

          if (!iSnap.exists) throw new Error('상품 없음');
          if (!pSnap.exists) throw new Error('참가자 없음');

          finalPrice      = iSnap.data().price || 0;
          const stock     = iSnap.data().stock;
          const pts       = pSnap.data().points || 0;

          if (pts < finalPrice) throw new Error('포인트가 부족해요');
          if (stock === 0)      throw new Error('품절된 상품이에요');

          tx.update(pRef, { points: firebase.firestore.FieldValue.increment(-finalPrice) });
          if (stock > 0) {
            tx.update(iRef, { stock: firebase.firestore.FieldValue.increment(-1) });
          }
        });

        // 주문 기록 (트랜잭션 밖)
        const orderData = {
          nickname,
          itemId:      item.id,
          itemName:    item.name,
          emoji:       item.emoji || '🎁',
          price:       finalPrice,
          confirmed:   false,
          purchasedAt: new Date().toISOString(),
        };
        db.collection('orders').add(orderData).catch(() =>
          setTimeout(() => db.collection('orders').add(orderData).catch(() => {}), 2000)
        );

        showToast(`🎉 ${item.name} 구매 완료! 판매자에게 수령하세요`);
      } catch (e) {
        showToast(e.message || '구매에 실패했어요');
      }
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // 모달 외부 클릭 닫기
    document.getElementById('buy-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('buy-modal')) closeModal();
    });
    document.getElementById('team-buy-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('team-buy-modal')) closeTeamModal();
    });
    // 초기 탭 display 맞추기
    document.getElementById('tab-items').style.display = 'flex';
    document.getElementById('tab-items').style.flexDirection = 'column';

    listenParticipant();
    listenItems();
    listenMyOrders();

    // 5초 안에 상품 안 뜨면 안내 메시지
    setTimeout(() => {
      const grid = document.getElementById('item-grid');
      if (grid && grid.querySelector('.empty-msg')?.textContent.includes('불러오는 중')) {
        grid.innerHTML = '<div class="empty-msg">📡 연결이 느려요. 새로고침 해보세요.<br><br><button onclick="location.reload()" style="margin-top:8px;padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;">🔄 새로고침</button></div>';
      }
    }, 5000);

    // Service Worker 등록 (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
