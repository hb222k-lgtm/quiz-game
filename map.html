<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>지도 - 탐험 퀴즈 게임</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-content-wrapper { border-radius: 14px; }
    .leaflet-popup-content { margin: 12px 16px; font-family: inherit; }
    .popup-quiz-btn {
      display: block; width: 100%; padding: 10px;
      background: #3b82f6; color: #fff; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; text-align: center;
    }
    .popup-quiz-btn:disabled {
      background: #94a3b8 !important;
      color: #fff !important;
      cursor: not-allowed;
      opacity: 0.85;
    }

    /* 방향 화살표 마커 */
    .user-marker {
      width: 48px; height: 48px;
      position: relative;
      transition: transform 0.3s ease;
    }
    .user-arrow {
      position: absolute;
      left: 50%; top: 2px;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 16px solid #3b82f6;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }
    .user-dot {
      position: absolute;
      width: 20px; height: 20px;
      background: #3b82f6;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .user-accuracy {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(59,130,246,0.12);
      border: 1.5px solid rgba(59,130,246,0.3);
      pointer-events: none;
    }

    /* 공지 배너 */
    /* ── 공지 팝업 ── */
    @keyframes popupIn {
      from { transform: translate(-50%,-50%) scale(0.85); opacity: 0; }
      to   { transform: translate(-50%,-50%) scale(1);    opacity: 1; }
    }
    .announce-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(0,0,0,0.5);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }
    .announce-popup {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      z-index: 9999; width: min(88vw, 360px);
      background: #fff; border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.28);
      animation: popupIn 0.28s ease;
    }
    .announce-popup-head {
      padding: 20px 20px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .announce-popup-icon { font-size: 28px; }
    .announce-popup-title { font-size: 15px; font-weight: 800; }
    .announce-popup-time  { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .announce-popup-msg {
      padding: 0 20px 20px;
      font-size: 15px; line-height: 1.65; color: #1e293b; white-space: pre-wrap;
    }
    .announce-popup-btn {
      display: block; width: 100%;
      padding: 15px; border: none;
      font-size: 15px; font-weight: 800; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="full-page">
    <!-- 헤더 -->
    <div class="map-header">
      <div>
        <div class="nickname" id="header-name">로딩 중...</div>
        <div style="font-size:12px; color:#64748b" id="header-progress"></div>
      </div>
      <div class="points-badge">⭐ <span id="header-points">0</span>점</div>
    </div>

    <!-- 지도 -->
    <div id="map-container" style="flex:1; position:relative;">
      <div id="map"></div>
      <div class="gps-status" id="gps-status">
        <div class="gps-dot" id="gps-dot"></div>
        <span id="gps-text">GPS 연결 중</span>
      </div>
      <!-- iOS용 나침반 권한 버튼 -->
      <div id="compass-btn" onclick="requestCompassPermission()" style="
        display:none; position:absolute; bottom:16px; left:50%;
        transform:translateX(-50%); z-index:500;
        background:#fff; border-radius:20px; padding:8px 16px;
        box-shadow:0 2px 12px rgba(0,0,0,0.2);
        font-size:13px; font-weight:600; cursor:pointer;
        white-space:nowrap;">
        🧭 나침반 켜기 (탭)
      </div>
    </div>

    <!-- 장소 팝업 (하단) -->
    <div class="location-popup" id="location-popup">
      <h3 id="popup-name"></h3>
      <p id="popup-desc"></p>
      <button class="btn btn-primary" id="popup-btn" onclick="goToQuiz()">퀴즈 풀기 →</button>
    </div>

    <!-- 하단 버튼 -->
    <div class="map-footer">
      <button class="btn btn-primary" id="follow-btn" onclick="toggleFollow()">
        📍 따라가기
      </button>
      <button class="btn btn-outline" onclick="window.location.href='qr-scan.html'">
        📷 QR
      </button>
      <button class="btn btn-primary" onclick="window.location.href='shop.html'"
        style="background:var(--grad-cyan);">
        🛒 상점
      </button>
      <button class="btn btn-outline" onclick="window.location.href='index.html'">
        🚪 나가기
      </button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    const nickname = getNickname();
    if (!nickname) { window.location.href = 'index.html'; }

    let map, userMarker, userCircle;
    let locations = [];
    let locationMarkers = {};
    let participant = { points: 0, completedLocations: [], scannedQRs: [] };
    let currentLocation = null;
    let activePopupLocationId = null;
    let followMode = true; // 내 위치 따라가기 켜짐
    const dismissedPopups = new Set(); // 사용자가 직접 닫은 팝업 (GPS 재진입까지 재표시 안 함)
    let _bonusMilestones = [];

    // ── 마커 아이콘 ──────────────────────────────
    function makeIcon(emoji, size = 36) {
      return L.divIcon({
        html: `<div style="
          font-size:${size}px; line-height:1;
          filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
          ">${emoji}</div>`,
        className: '',
        iconSize: [size, size],
        iconAnchor: [size/2, size/2],
        popupAnchor: [0, -size/2],
      });
    }

    // ── 지도 초기화 ───────────────────────────────
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(GAME_CONFIG.MAP_CENTER, GAME_CONFIG.MAP_ZOOM);
      // 네이버 지도와 유사한 깔끔한 스타일 타일
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
    }

    // ── 방향 마커 아이콘 생성 ──────────────────────
    let compassHeading = 0;

    function makeUserIcon(heading) {
      return L.divIcon({
        html: `<div class="user-marker" id="user-marker-el" style="transform:rotate(${heading}deg)">
                 <div class="user-arrow"></div>
                 <div class="user-dot"></div>
               </div>`,
        className: '',
        iconSize: [48, 48],
        iconAnchor: [24, 24],
      });
    }

    // ── 위치 스무딩 (표시용) ──────────────────────
    let _smLat = null, _smLng = null;
    function _smoothPos(lat, lng, accuracy) {
      if (_smLat === null) { _smLat = lat; _smLng = lng; return { lat, lng }; }
      // 정확도 낮을수록(숫자 클수록) 이전 위치 더 많이 반영
      const w = accuracy < 20 ? 0.75 : accuracy < 50 ? 0.55 : 0.35;
      _smLat = lat * w + _smLat * (1 - w);
      _smLng = lng * w + _smLng * (1 - w);
      return { lat: _smLat, lng: _smLng };
    }

    // ── 내 위치 마커 ──────────────────────────────
    function updateUserMarker(rawLat, rawLng, accuracy) {
      const { lat, lng } = _smoothPos(rawLat, rawLng, accuracy);

      if (!userMarker) {
        userMarker = L.marker([lat, lng], {
          icon: makeUserIcon(compassHeading), zIndexOffset: 1000
        }).addTo(map);
        userCircle = L.circle([lat, lng], {
          radius: Math.min(accuracy, 80),
          color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.10, weight: 1
        }).addTo(map);
        map.setView([lat, lng], map.getZoom());
      } else {
        userMarker.setLatLng([lat, lng]);
        userCircle.setLatLng([lat, lng]);
        userCircle.setRadius(Math.min(accuracy, 80));
      }
      if (followMode) {
        // 애니메이션 0.15s → GPS 업데이트 주기보다 짧아서 끊김 없음
        map.panTo([lat, lng], { animate: true, duration: 0.15, easeLinearity: 1 });
      }
    }

    // ── 나침반 방향 업데이트 ──────────────────────
    function updateCompass(heading) {
      compassHeading = heading;
      const el = document.getElementById('user-marker-el');
      if (el) el.style.transform = `rotate(${heading}deg)`;
    }

    // ── 나침반 이벤트 연결 ────────────────────────
    function attachCompassListener() {
      const handler = (e) => {
        let heading = null;
        if (typeof e.webkitCompassHeading === 'number') {
          heading = e.webkitCompassHeading;          // iOS (절대 북쪽 기준)
        } else if (typeof e.alpha === 'number') {
          heading = (360 - e.alpha) % 360;           // Android
        }
        if (heading !== null) updateCompass(Math.round(heading));
      };
      // Android는 deviceorientationabsolute가 더 정확
      window.addEventListener('deviceorientationabsolute', handler, true);
      window.addEventListener('deviceorientation', handler, true);
    }

    function startCompass() {
      if (typeof DeviceOrientationEvent === 'undefined') return;

      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+: 버튼 탭으로만 권한 요청 가능
        document.getElementById('compass-btn').style.display = 'block';
      } else {
        // Android Chrome / Samsung Internet / Firefox: 바로 시작 (권한 불필요)
        // Android에서 HTTPS가 아니면 deviceorientation이 작동하지 않을 수 있음
        attachCompassListener();
      }
    }

    async function requestCompassPermission() {
      try {
        const perm = await DeviceOrientationEvent.requestPermission();
        if (perm === 'granted') {
          attachCompassListener();
          document.getElementById('compass-btn').style.display = 'none';
          showToast('나침반이 켜졌어요 🧭');
        } else {
          showToast('나침반 권한이 거부됐어요');
        }
      } catch (e) {
        showToast('나침반을 사용할 수 없어요');
      }
    }

    // ── 따라가기 버튼 토글 ────────────────────────
    function toggleFollow() {
      followMode = !followMode;
      const btn = document.getElementById('follow-btn');
      if (followMode) {
        btn.textContent = '📍 따라가기 켜짐';
        btn.className = 'btn btn-primary';
        if (currentLocation) map.panTo([currentLocation.lat, currentLocation.lng]);
      } else {
        btn.textContent = '📍 따라가기 꺼짐';
        btn.className = 'btn btn-outline';
      }
    }

    // ── GPS 상태 표시 ─────────────────────────────
    function setGPSStatus(state, text) {
      const dot = document.getElementById('gps-dot');
      const label = document.getElementById('gps-text');
      dot.className = 'gps-dot ' + state;
      label.textContent = text;
    }

    // ── 장소 마커 렌더링 ──────────────────────────
    function renderLocationMarker(loc) {
      // 이미 완료한 장소는 지도에서 제거
      if (locationMarkers[loc.id]) {
        map.removeLayer(locationMarkers[loc.id]);
        delete locationMarkers[loc.id];
      }

      const isDone = (participant.completedLocations || []).includes(loc.id);
      if (isDone) return; // 완료된 장소는 마커 추가 안 함

      const marker = L.marker([loc.lat, loc.lng], { icon: makeIcon('📍') });
      marker.on('click', () => showLocationPopup(loc));
      marker.addTo(map);
      locationMarkers[loc.id] = marker;
    }

    // ── 팝업 표시 ─────────────────────────────────
    function showLocationPopup(loc) {
      if (!loc.enabled) return;
      const isDone = (participant.completedLocations || []).includes(loc.id);
      const dist = currentLocation
        ? Math.round(getDistance(currentLocation.lat, currentLocation.lng, loc.lat, loc.lng))
        : null;
      const inRange = dist !== null && dist <= GAME_CONFIG.LOCATION_RADIUS;

      activePopupLocationId = loc.id;
      document.getElementById('popup-name').textContent = `📍 ${loc.name}`;

      const btn = document.getElementById('popup-btn');

      btn.style.background = '';
      btn.style.color = '';
      if (isDone) {
        document.getElementById('popup-desc').textContent = '✅ 이미 완료한 장소예요! (+' + (loc.quiz?.points || 0) + '점)';
        btn.textContent = '완료됨';
        btn.disabled = true;
        btn.className = 'btn btn-success popup-quiz-btn';
      } else if (!currentLocation) {
        document.getElementById('popup-desc').textContent = 'GPS 위치를 확인 중이에요...';
        btn.textContent = 'GPS 대기 중';
        btn.disabled = true;
        btn.className = 'btn popup-quiz-btn';
      } else if (inRange) {
        document.getElementById('popup-desc').textContent = `🟢 ${dist}m 이내 — 퀴즈를 풀 수 있어요! (${loc.quiz?.points || 0}점)`;
        btn.textContent = '퀴즈 풀기 →';
        btn.disabled = false;
        btn.className = 'btn btn-primary popup-quiz-btn';
      } else {
        document.getElementById('popup-desc').textContent = `🔒 ${dist}m 떨어져 있어요. ${GAME_CONFIG.LOCATION_RADIUS}m 이내로 다가가세요.`;
        btn.textContent = `아직 멀어요 (${dist}m)`;
        btn.disabled = true;
        btn.className = 'btn popup-quiz-btn';
      }

      document.getElementById('location-popup').classList.add('visible');
    }

    function goToQuiz() {
      if (activePopupLocationId) {
        window.location.href = `quiz.html?loc=${activePopupLocationId}`;
      }
    }

    // 지도 빈 곳 클릭 시 팝업 닫기
    function closePopupOnMapClick() {
      if (activePopupLocationId) dismissedPopups.add(activePopupLocationId);
      document.getElementById('location-popup').classList.remove('visible');
      activePopupLocationId = null;
    }

    // ── GPS 감시 ──────────────────────────────────
    function startGPS() {
      if (!navigator.geolocation) {
        setGPSStatus('bad', 'GPS 미지원');
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude: lat, longitude: lng, accuracy } = pos.coords;

          // 정확도 150m 초과는 무시 (실내 Wi-Fi 위치 등 너무 부정확한 값)
          if (accuracy > 150) return;

          currentLocation = { lat, lng };

          updateUserMarker(lat, lng, accuracy);

          const acc = Math.round(accuracy);
          if (accuracy < 20)      setGPSStatus('good', `GPS ${acc}m`);
          else if (accuracy < 60) setGPSStatus('ok',   `GPS ${acc}m`);
          else                    setGPSStatus('bad',  `GPS ${acc}m`);

          // 범위 안에 들어온 장소가 있으면 자동 팝업
          locations.forEach(loc => {
            if (!loc.enabled) return;
            const dist = getDistance(lat, lng, loc.lat, loc.lng);
            if (dist <= GAME_CONFIG.LOCATION_RADIUS) {
              if (!(participant.completedLocations || []).includes(loc.id)
                  && activePopupLocationId !== loc.id
                  && !dismissedPopups.has(loc.id)) {
                showLocationPopup(loc);
              }
            } else {
              // 범위 벗어나면 dismissed 초기화 → 다시 들어올 때 재표시
              dismissedPopups.delete(loc.id);
            }
          });

          // 열려있는 팝업 거리 업데이트
          if (activePopupLocationId) {
            const loc = locations.find(l => l.id === activePopupLocationId);
            if (loc) showLocationPopup(loc);
          }
        },
        (err) => {
          setGPSStatus('bad', 'GPS 오류');
          console.warn('GPS error:', err);
        },
        { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
      );
    }

    // ── 참가자 데이터 실시간 수신 ─────────────────
    function listenParticipant() {
      if (!nickname) return;
      db.collection('participants').doc(nickname).onSnapshot(snap => {
        if (!snap.exists) return;
        participant = snap.data();
        document.getElementById('header-points').textContent = participant.points || 0;
        document.getElementById('header-name').textContent = nickname;
        document.getElementById('header-progress').textContent =
          `완료 ${(participant.completedLocations || []).length}/${locations.length}곳`;
        // 보너스 구간 확인
        checkBonusMilestones(participant.points || 0, participant.claimedMilestones);
        // 마커 갱신
        locations.forEach(loc => renderLocationMarker(loc));
      });
    }

    // ── 날짜 공개 여부 확인 ──────────────────────
    function isLocationActive(loc) {
      const now = new Date();
      if (loc.startDate && new Date(loc.startDate) > now) return false; // 아직 공개 전
      if (loc.endDate   && new Date(loc.endDate)   < now) return false; // 이미 종료
      return true;
    }

    // ── 장소 목록 로드 ────────────────────────────
    async function loadLocations() {
      const snap = await db.collection('locations').where('enabled', '==', true).get();
      locations = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(isLocationActive);
      locations.forEach(loc => renderLocationMarker(loc));
      document.getElementById('header-progress').textContent =
        `완료 ${(participant.completedLocations || []).length}/${locations.length}곳`;

      // 장소 변경 실시간 감지
      db.collection('locations').onSnapshot(snap => {
        locations = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(l => l.enabled && isLocationActive(l));
        locations.forEach(loc => renderLocationMarker(loc));
      });
    }

    // ── 참가자 포인트 강제 새로고침 ──────────────
    async function refreshParticipant() {
      const snap = await db.collection('participants').doc(nickname).get();
      if (!snap.exists) return;
      participant = snap.data();
      document.getElementById('header-points').textContent = participant.points || 0;
      document.getElementById('header-name').textContent = nickname;
      document.getElementById('header-progress').textContent =
        `완료 ${(participant.completedLocations || []).length}/${locations.length}곳`;
      locations.forEach(loc => renderLocationMarker(loc));
    }

    // ── 보너스 구간 ──────────────────────────────────
    async function loadMilestones() {
      try {
        const snap = await db.collection('config').doc('bonusMilestones').get();
        _bonusMilestones = snap.data()?.milestones || [];
      } catch (e) {}
    }

    async function checkBonusMilestones(pts, claimed) {
      if (!_bonusMilestones.length) return;
      const claimedSet = new Set(claimed || []);
      for (const m of _bonusMilestones) {
        const key = `ms_${m.threshold}`;
        if (pts >= m.threshold && !claimedSet.has(key)) {
          try {
            await db.collection('participants').doc(nickname).update({
              points: firebase.firestore.FieldValue.increment(m.bonus),
              claimedMilestones: firebase.firestore.FieldValue.arrayUnion(key)
            });
            showToast(`🎁 ${m.threshold}점 달성! 보너스 +${m.bonus}점 지급!`);
          } catch (e) {}
        }
      }
    }

    // ── 공지 수신 ─────────────────────────────────
    let _lastAnnounceUid = null;

    function requestNotifPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function listenAnnouncements() {
      const since = new Date();
      // orderBy 없이 단일 문서 감시 → 인덱스 불필요, 즉각 수신
      db.collection('config').doc('latestAnnouncement')
        .onSnapshot(snap => {
          if (!snap.exists) return;
          const a = snap.data();
          if (!a.sentAt || !a.uid) return;
          if (a.uid === _lastAnnounceUid) return;          // 페이지 열기 전에 보낸 공지는 접속 시 별도 처리
          if (a.sentAt.toDate() < since) return;
          _lastAnnounceUid = a.uid;
          showAnnouncePopup(a);
        }, err => console.warn('공지 수신 오류:', err));
    }

    function _timeAgo(date) {
      const diff = Math.floor((Date.now() - date.getTime()) / 1000);
      if (diff < 60)  return '방금 전';
      if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
      return date.toLocaleDateString('ko-KR');
    }

    function _closeAnnouncePopup() {
      document.querySelector('.announce-overlay')?.remove();
      document.querySelector('.announce-popup')?.remove();
    }

    function showAnnouncePopup(a, timeLabel) {
      const BG   = { info:'#3b82f6', mission:'#7c3aed', urgent:'#ef4444' };
      const ICON = { info:'📋', mission:'🎯', urgent:'🚨' };
      const bg   = BG[a.type]  || '#3b82f6';
      const icon = ICON[a.type] || '📢';
      const time = timeLabel || (a.sentAt ? _timeAgo(a.sentAt.toDate()) : '');

      // 진동
      if (navigator.vibrate)
        navigator.vibrate(a.type === 'urgent' ? [300,100,300,100,300] : [200,100,200]);

      // 백그라운드 OS 알림
      if ('Notification' in window && !document.hasFocus() && Notification.permission === 'granted') {
        new Notification(`${icon} ${a.title||'공지'}`, { body: a.message, tag:'announce' });
      }

      // 기존 팝업 제거
      _closeAnnouncePopup();

      const overlay = document.createElement('div');
      overlay.className = 'announce-overlay';
      overlay.addEventListener('click', _closeAnnouncePopup);

      const popup = document.createElement('div');
      popup.className = 'announce-popup';
      popup.innerHTML = `
        <div class="announce-popup-head" style="border-bottom:3px solid ${bg};">
          <span class="announce-popup-icon">${icon}</span>
          <div>
            <div class="announce-popup-title">${escHtml(a.title||'공지')}</div>
            ${time ? `<div class="announce-popup-time">🕐 ${time}</div>` : ''}
          </div>
        </div>
        <div class="announce-popup-msg">${escHtml(a.message)}</div>
        <button class="announce-popup-btn" style="background:${bg};">확인</button>`;

      // inline onclick 대신 addEventListener 사용 (스코프 문제 방지)
      popup.querySelector('.announce-popup-btn').addEventListener('click', _closeAnnouncePopup);

      document.body.appendChild(overlay);
      document.body.appendChild(popup);
    }

    // 접속 시 최근 공지 확인 (30분 이내)
    async function checkRecentAnnouncement() {
      try {
        const snap = await db.collection('config').doc('latestAnnouncement').get();
        if (!snap.exists) return;
        const a = snap.data();
        if (!a.sentAt || !a.uid) return;
        const sentDate = a.sentAt.toDate();
        if ((Date.now() - sentDate.getTime()) > 30 * 60000) return;

        const readKey = 'read_announce_' + a.uid;
        if (localStorage.getItem(readKey)) return;

        _lastAnnounceUid = a.uid;
        showAnnouncePopup(a, _timeAgo(sentDate));
        localStorage.setItem(readKey, '1');
      } catch(e) { console.warn('최근 공지 확인 오류:', e); }
    }

    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── 초기화 ────────────────────────────────────
    document.getElementById('header-name').textContent = nickname;

    function startAll() {
      initMap();
      map.on('click', closePopupOnMapClick);
      map.on('dragstart', () => {
        if (followMode) {
          followMode = false;
          const btn = document.getElementById('follow-btn');
          btn.textContent = '📍 따라가기 꺼짐';
          btn.className = 'btn btn-outline';
        }
      });
      startGPS();
      startCompass();
      // loadLocations 먼저 완료 후 listenParticipant → 진행도 "N/0곳" 표시 방지
      loadLocations().then(() => listenParticipant());
      loadMilestones();
      requestNotifPermission();
      listenAnnouncements();
      checkRecentAnnouncement();
    }

    // Leaflet 로드 확인 후 시작 (CDN 실패 시 unpkg로 재시도)
    if (typeof L !== 'undefined') {
      startAll();
    } else {
      document.getElementById('gps-text').textContent = '지도 로딩 중...';
      const fallback = document.createElement('script');
      fallback.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      fallback.onload = startAll;
      fallback.onerror = () => {
        document.getElementById('header-name').textContent = '지도 로딩 실패';
        document.getElementById('gps-text').textContent = '새로고침 해주세요';
      };
      document.head.appendChild(fallback);
    }

    // 뒤로가기로 돌아왔을 때 포인트 즉시 갱신 (bfcache 대응)
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) refreshParticipant();
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshParticipant();
    });

    // Service Worker 등록 (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
