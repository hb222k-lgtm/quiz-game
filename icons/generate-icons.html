<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>아래 버튼을 눌러 아이콘을 생성하고 다운로드하세요.</p>
<canvas id="c192" width="192" height="192" style="border:1px solid #ccc; margin:8px;"></canvas>
<canvas id="c512" width="512" height="512" style="border:1px solid #ccc; margin:8px;"></canvas>
<br>
<button onclick="gen()">아이콘 생성 및 다운로드</button>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.218;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#7c3aed');
  grad.addColorStop(1, '#a855f7');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.font = `${s * 0.55}px Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🗺️', s / 2, s / 2 + s * 0.04);
}
function download(canvas, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}
function gen() {
  drawIcon(document.getElementById('c192'));
  drawIcon(document.getElementById('c512'));
  setTimeout(() => {
    download(document.getElementById('c192'), 'icon-192.png');
    setTimeout(() => download(document.getElementById('c512'), 'icon-512.png'), 500);
  }, 100);
}
gen();
</script>
</body>
</html>
