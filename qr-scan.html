<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="탐험퀴즈">
  <title>QR 스캔 - 탐험 퀴즈 게임</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    body { background: linear-gradient(160deg, #0d0720 0%, #1a0a35 40%, #2d1060 100%); }
    /* html5-qrcode 기본 UI 숨기기 */
    #qr-reader__scan_region > img { display: none; }
    #qr-reader__dashboard_section_csr span { font-size: 13px !important; }
    #qr-reader__dashboard_section_fsr { display: none !important; }
    #qr-reader__header_message { display: none !important; }
    .page-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff; border: 1.5px solid var(--border);
      font-size: 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm); flex-shrink: 0;
      color: var(--text);
    }
    .page-header h2 { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
    .tips-card { background: var(--bg2); border-color: #c4b5fd; }
    .tips-card p { font-size: 13px; color: var(--primary); line-height: 1.8; font-weight: 600; }
    #qr-quiz-wrap .card {
      border-left: 4px solid var(--primary);
    }
    .quiz-label {
      font-size: 12px; color: var(--primary); font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    #qr-quiz-question {
      font-size: 16px; font-weight: 700; line-height: 1.6;
      margin-bottom: 16px; color: var(--text);
    }
    .qr-result { white-space: pre-line; }
    /* ── 30초 타이머 ── */
    #qr-timer-wrap {
      display: none; justify-content: center; align-items: center;
      margin: 8px 0; position: relative; height: 64px;
    }
    .timer-svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .timer-bg { fill: none; stroke: #e2e8f0; stroke-width: 3; }
    .timer-ring {
      fill: none; stroke: #7c3aed; stroke-width: 3;
      stroke-dasharray: 100 0; stroke-dashoffset: 25;
      stroke-linecap: round;
      transition: stroke-dasharray 1s linear, stroke 0.4s;
    }
    #qr-timer-count {
      position: absolute; font-size: 22px; font-weight: 900; color: #1e293b;
      transition: color 0.4s;
    }
    .result-explanation {
      display: block; margin-top: 6px; font-size: 13px; font-weight: 600; opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <button class="back-btn" onclick="stopScannerAndGoBack()">←</button>
      <h2>📷 QR 코드 스캔</h2>
    </div>

    <div class="card" style="padding:16px;">
      <p class="text-muted mb-8" style="text-align:center; font-size:13px; font-weight:600;">
        카메라에 QR 코드를 비춰주세요
      </p>
      <div id="qr-reader"></div>
    </div>

    <div class="qr-result" id="qr-result"></div>

    <!-- 퀴즈 QR 문제 영역 -->
    <div id="qr-quiz-wrap" style="display:none; margin-top:12px;">
      <div class="card">
        <div class="quiz-label">❓ 퀴즈 도전</div>
        <p id="qr-quiz-question"></p>
        <div id="qr-timer-wrap" style="display:none;">
          <svg class="timer-svg" viewBox="0 0 36 36">
            <circle class="timer-bg" cx="18" cy="18" r="15.9"/>
            <circle class="timer-ring" cx="18" cy="18" r="15.9" id="qr-timer-ring"/>
          </svg>
          <span id="qr-timer-count">30</span>
        </div>
        <div id="qr-quiz-options"></div>
      </div>
    </div>

    <!-- 💳 결제 확인 영역 -->
    <div id="pay-confirm-wrap" style="display:none; margin-top:12px;">
      <div class="card" style="text-align:center; padding:22px 18px;">
        <div style="font-size:44px; margin-bottom:8px;" id="pay-emoji">💳</div>
        <div id="pay-label" style="font-size:18px; font-weight:900; margin-bottom:4px;"></div>
        <div style="font-size:13px; color:#94a3b8; margin-bottom:14px;">포인트로 결제할까요?</div>
        <div id="pay-team-line" style="display:none; background:#e0f2fe; border:1.5px solid #7dd3fc; border-radius:12px; padding:10px 14px; margin-bottom:10px; font-size:13px; font-weight:700; color:#0369a1; line-height:1.6;"></div>
        <div style="background:#f5f3ff; border-radius:14px; padding:14px 16px; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span id="pay-amount-label" style="font-size:13px; color:#64748b; font-weight:600;">결제 금액</span>
            <span id="pay-amount" style="font-size:16px; font-weight:900; color:#7c3aed;"></span>
          </div>
          <div style="display:flex; justify-content:space-between;">
            <span id="pay-after-label" style="font-size:13px; color:#64748b; font-weight:600;">결제 후 잔액</span>
            <span id="pay-after" style="font-size:14px; font-weight:800;"></span>
          </div>
        </div>
        <div style="font-size:12px; color:#94a3b8; margin-bottom:12px;">보유: ⭐ <span id="pay-mypts"></span>점</div>
        <button class="btn btn-primary" id="pay-confirm-btn" onclick="confirmPay()" style="margin-bottom:8px;">💳 결제하기</button>
        <button class="btn btn-outline" onclick="cancelPay()">취소</button>
      </div>
    </div>

    <div id="scan-again-wrap" style="display:none; margin-top:12px;">
      <button class="btn btn-outline" onclick="resetScanner()">🔄 다시 스캔하기</button>
    </div>

    <!-- QR 힌트 체인 -->
    <div id="hint-box" style="display:none; margin-top:14px; background:linear-gradient(135deg,#fef3c7,#fffbeb); border:2px solid #f59e0b; border-radius:16px; padding:14px 16px;">
      <div style="font-size:13px;font-weight:800;color:#92400e;margin-bottom:6px;">🔗 다음 힌트</div>
      <div id="hint-text" style="font-size:15px;font-weight:600;color:#1e293b;line-height:1.6;"></div>
    </div>

    <div class="card mt-16 tips-card">
      <p>
        📌 QR 코드는 1인당 1회만 스캔 가능해요 (💳 결제 QR 제외)<br>
        📌 카메라 접근 권한을 허용해야 해요<br>
        📌 밝은 곳에서 스캔하면 더 잘 인식돼요
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    const nickname = getNickname();
    if (!nickname) { window.location.href = 'index.html'; }

    let scanner = null;
    if (!nickname) { document.body.innerHTML = ''; } // redirect 후 실행 방지
    let processing = false;

    function startScanner() {
      scanner = new Html5Qrcode('qr-reader');

      // 후면 카메라 우선 시도 → 실패 시 전면/기본 카메라로 재시도
      // (일부 안드로이드·삼성 인터넷에서 environment 모드가 권한 오류 반환)
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      ).catch(() => {
        // 후면 카메라 실패 → 기본 카메라로 재시도
        scanner.start(
          { facingMode: 'user' },
          { fps: 10, qrbox: { width: 240, height: 240 } },
          onScanSuccess,
          () => {}
        ).catch(() => {
          // 모든 카메라 실패 → 에러 메시지
          const r = document.getElementById('qr-result');
          r.className = 'qr-result show error';
          r.textContent = '카메라를 사용할 수 없어요. HTTPS 접속 및 카메라 권한을 확인해주세요.';
          r.style.display = 'block';
        });
      });
    }

    let currentQRCode = null;
    let quizAnswered = false;
    let qrAttempts = 0;

    async function onScanSuccess(decodedText) {
      if (processing) return;
      processing = true;

      if (scanner) {
        await scanner.stop().catch(() => {});
        scanner = null;
      }

      let code = decodedText;
      try {
        const url = new URL(decodedText);
        code = url.searchParams.get('code') || decodedText;
      } catch {}

      await handleQRCode(code);
    }

    async function handleQRCode(code) {
      const resultEl = document.getElementById('qr-result');
      resultEl.style.display = 'block';
      resultEl.className = 'qr-result show';
      resultEl.textContent = '확인 중...';

      try {
        const qrSnap = await db.collection('qrcodes').doc(code).get();
        if (!qrSnap.exists) {
          showResult(false, '유효하지 않은 QR 코드예요.');
          return;
        }
        const qrData = { id: code, ...qrSnap.data() };

        if (!qrData.enabled) {
          showResult(false, '비활성화된 QR 코드예요.');
          return;
        }

        // 활성 기간 체크
        const now = new Date();
        if (qrData.startAt && new Date(qrData.startAt) > now) {
          const t = new Date(qrData.startAt).toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
          showResult(false, `⏳ 아직 활성화 전이에요.\n${t}부터 스캔 가능해요.`);
          return;
        }
        if (qrData.endAt && new Date(qrData.endAt) < now) {
          showResult(false, '⌛ 만료된 QR 코드예요.');
          return;
        }

        // 💳 결제/팀 결제 QR은 개인 usedBy 체크 안 함 (자체 규칙 사용)
        if (qrData.type !== 'pay' && qrData.type !== 'team_pay' && (qrData.usedBy || []).includes(nickname)) {
          showResult(false, '이미 스캔한 QR 코드예요.');
          return;
        }

        if (qrData.type === 'pay') {
          // 💳 포인트 결제 — 확인 화면 표시
          if (qrData.oncePer && (qrData.usedBy || []).includes(nickname)) {
            showResult(false, '이미 결제한 QR이에요. (1인 1회 제한)');
            return;
          }
          resultEl.style.display = 'none';
          showPayConfirm(qrData);

        } else if (qrData.type === 'team_pay') {
          // 🧑‍🤝‍🧑 팀 결제 — 팀장이 스캔하면 팀원 전체 1/n 차감
          resultEl.style.display = 'none';
          await showTeamPayConfirm(qrData);

        } else if (qrData.type === 'quiz') {
          resultEl.style.display = 'none';
          currentQRCode = qrData;

          // 문제 은행에서 랜덤 배정
          const bankSnap = await db.collection('quiz_bank').where('enabled', '==', true).get();
          const allQ = bankSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (!allQ.length) { showResult(false, '문제 은행이 비어있어요. 관리자에게 문의하세요.'); return; }

          // 이 QR에서 문제별 배정 횟수 조회 → 가장 덜 나온 문제 선택
          const statsSnap = await db.collection('qr_quiz_assignments').doc(code).get();
          const stats = statsSnap.exists ? statsSnap.data() : {};
          const chosen = allQ
            .map(q => ({ ...q, count: stats[q.id] || 0 }))
            .sort((a, b) => a.count - b.count || Math.random() - 0.5)[0];

          // parseInt(0)||100 이 100을 반환하는 버그 방지: nullish coalescing 사용
          const qrPts = qrData.quizPoints != null ? parseInt(qrData.quizPoints) : 100;
          qrData._quiz = { ...chosen, points: isNaN(qrPts) ? 100 : qrPts };
          showQRQuiz(qrData);

        } else if (qrData.type === 'minus') {
          // 📉 포인트 차감 (0점 아래로 내려가지 않음)
          const res = await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const pSnap = await tx.get(pRef);
            const cur = pSnap.data()?.points || 0;
            const curEarned = pSnap.data()?.earnedPoints || 0;
            const deduct = qrData.points || 0;
            const newPts = Math.max(0, cur - deduct);
            const newEarned = Math.max(0, curEarned - deduct); // 순위(누적)도 차감 → 진짜 페널티
            tx.update(pRef, { points: newPts, earnedPoints: newEarned, scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
            return { deducted: deduct, earnedLost: curEarned - newEarned };
          });
          showResult(false, `😱 ${qrData.label || 'QR'} 스캔! 순위 점수 -${res.deducted}점... 다음엔 잘 골라요!`);
          showHintBox(qrData.hint);
          checkAndAwardBadges(nickname, []).then(newBadges => showNewBadges(newBadges));

        } else if (qrData.type === 'double') {
          // 🎰 점수 2배 (보유 + 누적/순위 둘 다)
          const res = await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const pSnap = await tx.get(pRef);
            const cur = pSnap.data()?.points || 0;
            const curEarned = pSnap.data()?.earnedPoints || 0;
            tx.update(pRef, { points: cur * 2, earnedPoints: curEarned * 2, scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
            return { before: cur, after: cur * 2 };
          });
          showResult(true, `🎰 대박! 점수 2배! ${res.before}점 → ${res.after}점!`);
          showHintBox(qrData.hint);
          checkAndAwardBadges(nickname, []).then(newBadges => showNewBadges(newBadges));

        } else if (qrData.type === 'half') {
          // ✂️ 점수 절반 (보유 + 누적/순위 둘 다)
          const res = await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const pSnap = await tx.get(pRef);
            const cur = pSnap.data()?.points || 0;
            const curEarned = pSnap.data()?.earnedPoints || 0;
            const newPts = Math.floor(cur / 2);
            const newEarned = Math.floor(curEarned / 2);
            tx.update(pRef, { points: newPts, earnedPoints: newEarned, scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
            return { before: cur, after: newPts };
          });
          showResult(false, `✂️ 아이쿠! 점수 절반... ${res.before}점 → ${res.after}점`, 'warning');
          showHintBox(qrData.hint);
          checkAndAwardBadges(nickname, []).then(newBadges => showNewBadges(newBadges));

        } else if (qrData.type === 'nothing') {
          // 💨 꽝!
          await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            tx.update(pRef, { scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          });
          showResult(false, `💨 꽝! 아무 일도 일어나지 않았어요 😅`, 'warning');
          showHintBox(qrData.hint);
          checkAndAwardBadges(nickname, []).then(newBadges => showNewBadges(newBadges));

        } else if (qrData.type === 'team_mission') {
          // 🤝 팀 미션 QR — 같은 팀 N명 스캔 시 팀 전원 보너스
          const pSnap = await db.collection('participants').doc(nickname).get();
          const myTeam = pSnap.data()?.team;
          if (!myTeam) {
            showResult(false, '팀에 속하지 않으면 팀 미션을 스캔할 수 없어요.\n먼저 팀을 선택해주세요.');
            return;
          }
          const required = qrData.requiredMembers || 3;
          const bonus    = qrData.teamBonusPoints  || 200;

          const res = await db.runTransaction(async tx => {
            const qRef = db.collection('qrcodes').doc(code);
            const pRef = db.collection('participants').doc(nickname);
            const qSnap = await tx.get(qRef);
            const qd = qSnap.data() || {};
            if ((qd.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const teamData = (qd.teamProgress || {})[myTeam] || { members: [], completed: false };
            if (teamData.completed) throw new Error('TEAM_DONE');
            if ((teamData.members || []).includes(nickname)) throw new Error('ALREADY_USED');
            const newCount = (teamData.members || []).length + 1;
            const isComplete = newCount >= required;
            const updates = {
              usedBy: firebase.firestore.FieldValue.arrayUnion(nickname),
              [`teamProgress.${myTeam}.members`]: firebase.firestore.FieldValue.arrayUnion(nickname),
            };
            if (isComplete) updates[`teamProgress.${myTeam}.completed`] = true;
            tx.update(qRef, updates);
            tx.update(pRef, { scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            return { count: newCount, required, isComplete };
          });

          if (res.isComplete) {
            // 팀 전원에게 보너스 지급 (골든타임 배율 적용)
            const mult = await getGoldenMultiplier();
            const finalBonus = Math.round(bonus * mult);
            const teamSnap = await db.collection('participants').where('team', '==', myTeam).get();
            const chunkSize = 500;
            for (let ci = 0; ci < teamSnap.docs.length; ci += chunkSize) {
              const batch = db.batch();
              teamSnap.docs.slice(ci, ci + chunkSize).forEach(d => {
                batch.update(d.ref, {
                  points:       firebase.firestore.FieldValue.increment(finalBonus),
                  earnedPoints: firebase.firestore.FieldValue.increment(finalBonus),
                });
              });
              await batch.commit();
            }
            const goldenMsg = mult > 1 ? ` (⚡ 골든타임 ×${mult})` : '';
            showResult(true, `🎉 팀 미션 완료! ${res.required}명 모두 스캔!\n팀 전원 +${finalBonus}점 지급됐어요!${goldenMsg}`);
            showHintBox(qrData.hint);
            const extras = ['team_player'];
            if (mult > 1) extras.push('golden');
            checkAndAwardBadges(nickname, extras).then(newBadges => showNewBadges(newBadges));
          } else {
            showResult(true, `✅ 스캔 완료! 우리 팀 ${res.count}/${res.required}명\n${res.required - res.count}명 더 스캔하면 팀 전원 +${bonus}점!`);
            showHintBox(qrData.hint);
            checkAndAwardBadges(nickname, ['team_player']).then(newBadges => showNewBadges(newBadges));
          }

        } else {
          // 💰 포인트 즉시 지급 — 트랜잭션 내에서 usedBy 재확인 (동시 스캔 중복 방지)
          const mult = await getGoldenMultiplier();
          const basePts = qrData.points || 0;
          const pts = Math.round(basePts * mult);
          await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            tx.update(pRef, {
              points:       firebase.firestore.FieldValue.increment(pts),
              earnedPoints: firebase.firestore.FieldValue.increment(pts),
              scannedQRs:   firebase.firestore.FieldValue.arrayUnion(code)
            });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          });
          const goldenMsg = mult > 1 ? ` (⚡ 골든타임 ×${mult})` : '';
          showResult(true, `"${qrData.label || 'QR 코드'}" 스캔 완료! +${pts}점 획득!${goldenMsg}`);
          showHintBox(qrData.hint);
          const extras = [];
          if (mult > 1) extras.push('golden');
          checkAndAwardBadges(nickname, extras).then(newBadges => showNewBadges(newBadges));
        }
      } catch (e) {
        if (e.message === 'ALREADY_USED') {
          showResult(false, '이미 스캔한 QR 코드예요.');
        } else if (e.message === 'TEAM_DONE') {
          showResult(false, '우리 팀이 이미 이 미션을 완료했어요! 🎉');
        } else {
          showResult(false, '오류가 발생했어요. 다시 시도해주세요.');
        }
      }
    }

    // ── QR 타이머 (실제 시계 기준 — 앱 나가도 시간 계속 흐름, 꼼수 방지) ──
    const QR_TIME = 30;
    let _qrTimerInterval = null;
    let _qrTimerOnTimeUp = null;
    let _qrDeadline = 0;

    function startQRTimer(onTimeUp) {
      _qrTimerOnTimeUp = onTimeUp;
      _qrDeadline = Date.now() + QR_TIME * 1000;
      const wrap = document.getElementById('qr-timer-wrap');
      wrap.style.display = 'flex';
      _tickQRTimer();
      clearInterval(_qrTimerInterval);
      _qrTimerInterval = setInterval(_tickQRTimer, 250);
    }

    function _tickQRTimer() {
      const remainMs = _qrDeadline - Date.now();
      const sec = Math.max(0, Math.ceil(remainMs / 1000));
      _updateQRTimerUI(sec);
      if (remainMs <= 0) {
        clearInterval(_qrTimerInterval);
        const cb = _qrTimerOnTimeUp;
        _qrTimerOnTimeUp = null;
        if (cb) cb();
      }
    }

    function stopQRTimer() {
      clearInterval(_qrTimerInterval);
      _qrTimerOnTimeUp = null;
      _qrDeadline = 0;
      const wrap = document.getElementById('qr-timer-wrap');
      if (wrap) wrap.style.display = 'none';
    }

    // 앱을 나갔다 돌아오면 즉시 남은 시간 재확인 (백그라운드 중 초과 시 바로 시간 초과)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && _qrTimerOnTimeUp && _qrDeadline) _tickQRTimer();
    });

    function _updateQRTimerUI(sec) {
      const pct = Math.max(0, (sec / QR_TIME) * 100);
      const ring = document.getElementById('qr-timer-ring');
      const cnt  = document.getElementById('qr-timer-count');
      if (!ring || !cnt) return;
      ring.setAttribute('stroke-dasharray', `${pct} ${100 - pct}`);
      const color = sec <= 5 ? '#ef4444' : sec <= 10 ? '#f59e0b' : '#7c3aed';
      ring.setAttribute('stroke', color);
      cnt.textContent = sec;
      cnt.style.color = sec <= 5 ? '#ef4444' : sec <= 10 ? '#f59e0b' : '#1e293b';
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function handleQRTimeUp() {
      if (quizAnswered) return;
      quizAnswered = true;
      stopQRTimer();
      const quiz = currentQRCode?._quiz || currentQRCode?.quiz;
      if (!quiz) return;
      const btns = document.querySelectorAll('#qr-quiz-options button');
      btns.forEach(b => b.disabled = true);
      btns[quiz.correctIndex]?.classList.add('correct');
      const correctText = quiz.options?.[quiz.correctIndex] || '';
      const explanation = quiz.explanation || '';
      try {
        const qRef = db.collection('qrcodes').doc(currentQRCode.id);
        await db.runTransaction(async tx => {
          const qSnap = await tx.get(qRef);
          if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
          tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          tx.update(db.collection('participants').doc(nickname), {
            scannedQRs: firebase.firestore.FieldValue.arrayUnion(currentQRCode.id)
          });
        });
        checkAndAwardBadges(nickname, []).then(newBadges => showNewBadges(newBadges));
      } catch(e) { if (e.message !== 'ALREADY_USED') console.error(e); }
      const resultEl = document.getElementById('qr-result');
      resultEl.style.display = 'block';
      resultEl.className = 'qr-result show error';
      resultEl.innerHTML = `⏰ 시간 초과! 정답: <b>${escHtml(correctText)}</b>`
        + (explanation ? `<span class="result-explanation">${escHtml(explanation)}</span>` : '');
      document.getElementById('scan-again-wrap').style.display = 'block';
    }

    function showQRQuiz(qrData) {
      quizAnswered = false;
      const quiz = qrData._quiz || qrData.quiz;
      document.getElementById('qr-quiz-question').textContent = quiz.question;

      const optContainer = document.getElementById('qr-quiz-options');
      optContainer.innerHTML = '';
      (quiz.options || []).forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${['①','②','③','④'][i] || (i+1)+'.'} ${opt}`;
        btn.onclick = () => answerQRQuiz(i, qrData);
        optContainer.appendChild(btn);
      });

      document.getElementById('qr-quiz-wrap').style.display = 'block';
      startQRTimer(handleQRTimeUp);
    }

    async function answerQRQuiz(selected, qrData) {
      if (quizAnswered) return;
      stopQRTimer();

      const quiz = qrData._quiz || qrData.quiz;
      const btns = document.querySelectorAll('#qr-quiz-options button');
      const isCorrect = selected === quiz.correctIndex;
      const explanation = quiz.explanation || '';

      if (isCorrect) {
        quizAnswered = true;
        btns.forEach(b => b.disabled = true);
        btns[selected].classList.add('correct');

        try {
          const basePts = parseInt(quiz.points) || 0;
          const mult = await getGoldenMultiplier();
          const pts = Math.round(basePts * mult);
          await db.runTransaction(async tx => {
            const qRef = db.collection('qrcodes').doc(qrData.id);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            tx.update(db.collection('participants').doc(nickname), {
              points:       firebase.firestore.FieldValue.increment(pts),
              earnedPoints: firebase.firestore.FieldValue.increment(pts),
              scannedQRs:   firebase.firestore.FieldValue.arrayUnion(qrData.id)
            });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          });
          if (currentQRCode?.id && quiz.id) {
            db.collection('qr_quiz_assignments').doc(currentQRCode.id).set(
              { [quiz.id]: firebase.firestore.FieldValue.increment(1) }, { merge: true }
            ).catch(() => {});
          }
          const goldenMsg = mult > 1 ? ` (⚡×${mult})` : '';
          const resultEl = document.getElementById('qr-result');
          resultEl.style.display = 'block';
          resultEl.className = 'qr-result show success';
          resultEl.innerHTML = `🎉 정답! +${pts}점 획득!${goldenMsg}`
            + (explanation ? `<span class="result-explanation">${escHtml(explanation)}</span>` : '');
          document.getElementById('scan-again-wrap').style.display = 'block';
          showHintBox(qrData.hint);
          const extras = [];
          if (mult > 1) extras.push('golden');
          checkAndAwardBadges(nickname, extras).then(newBadges => showNewBadges(newBadges));
        } catch (e) {
          if (e.message === 'ALREADY_USED') showResult(false, '이미 처리된 QR 코드예요.');
          else showResult(false, '오류가 발생했어요: ' + e.message);
        }

      } else {
        qrAttempts++;
        btns[selected].classList.add('wrong');
        btns[selected].disabled = true;

        if (qrAttempts < 2) {
          const resultEl = document.getElementById('qr-result');
          resultEl.style.display = 'block';
          resultEl.className = 'qr-result show warning';
          resultEl.textContent = '😅 틀렸어요! 한 번 더 기회가 있어요.';
          startQRTimer(handleQRTimeUp); // 타이머 재시작 (2번째 도전)
          btns.forEach((b, i) => { if (i !== selected) b.disabled = false; });
        } else {
          quizAnswered = true;
          btns.forEach(b => b.disabled = true);
          btns[quiz.correctIndex].classList.add('correct');

          try {
            const qRef = db.collection('qrcodes').doc(qrData.id);
            await db.runTransaction(async tx => {
              const qSnap = await tx.get(qRef);
              if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
              tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
              tx.update(db.collection('participants').doc(nickname), {
                scannedQRs: firebase.firestore.FieldValue.arrayUnion(qrData.id)
              });
            });
            checkAndAwardBadges(nickname, []).then(newBadges => showNewBadges(newBadges));
          } catch (e) {
            if (e.message !== 'ALREADY_USED') console.error('QR usedBy update error:', e);
          }
          const correctText = quiz.options?.[quiz.correctIndex] || '';
          const resultEl = document.getElementById('qr-result');
          resultEl.style.display = 'block';
          resultEl.className = 'qr-result show error';
          resultEl.innerHTML = `😢 아쉬워요! 정답: <b>${escHtml(correctText)}</b>`
            + (explanation ? `<span class="result-explanation">${escHtml(explanation)}</span>` : '');
          document.getElementById('scan-again-wrap').style.display = 'block';
        }
      }
    }

    function showResult(success, message, resultClass) {
      const resultEl = document.getElementById('qr-result');
      resultEl.style.display = 'block';
      resultEl.className = 'qr-result show ' + (resultClass || (success ? 'success' : 'error'));
      resultEl.textContent = message;
      document.getElementById('scan-again-wrap').style.display = 'block';
    }

    function showHintBox(hint) {
      const box = document.getElementById('hint-box');
      if (!hint || !box) return;
      document.getElementById('hint-text').textContent = hint;
      box.style.display = 'block';
    }

    function showNewBadges(newBadges) {
      if (!newBadges || !newBadges.length) return;
      newBadges.forEach((key, i) => {
        const info = ACHIEVEMENTS[key];
        if (!info) return;
        setTimeout(() => {
          showToast(`🏅 배지 획득! ${info.emoji} ${info.name} — ${info.desc}`);
        }, i * 1200);
      });
    }

    // ── 💳 포인트 결제 / 🧑‍🤝‍🧑 팀 결제 ──────────────
    let _payQR = null;
    let _payTeamCtx = null; // 팀 결제 컨텍스트 {teamId, teamName, count, per}
    let _paying = false;

    // 결제 최종 금액 = 원가 × (1 - 할인율%)
    function payFinalAmount(qr) {
      const orig = qr.points || 0;
      const disc = Math.min(100, Math.max(0, qr.discount || 0));
      return Math.round(orig * (100 - disc) / 100);
    }

    async function showPayConfirm(qrData) {
      _payQR = qrData;
      _payTeamCtx = null;
      const orig = qrData.points || 0;
      const discount = Math.min(100, Math.max(0, qrData.discount || 0));
      const amount = payFinalAmount(qrData);
      let myPts = 0;
      try { myPts = (await db.collection('participants').doc(nickname).get()).data()?.points || 0; } catch(e) {}

      // 할인 안내 줄 (pay-team-line 재사용)
      const discLine = document.getElementById('pay-team-line');
      if (discount > 0) {
        discLine.style.display = 'block';
        discLine.style.cssText = 'display:block; background:#fef3c7; border:1.5px solid #fbbf24; border-radius:12px; padding:10px 14px; margin-bottom:10px; font-size:14px; font-weight:800; color:#92400e; line-height:1.6;';
        discLine.innerHTML = `🏷️ ${discount}% 할인!<br><span style="font-weight:600;">원가 <s>${orig}점</s> → <b>${amount}점</b></span>`;
      } else {
        discLine.style.display = 'none';
      }

      document.getElementById('pay-amount-label').textContent = discount > 0 ? '할인가' : '결제 금액';
      document.getElementById('pay-after-label').textContent  = '결제 후 잔액';
      document.getElementById('pay-emoji').textContent  = qrData.emoji || '💳';
      document.getElementById('pay-label').textContent  = qrData.label || '포인트 결제';
      document.getElementById('pay-amount').textContent = `⭐ ${amount}점`;
      document.getElementById('pay-mypts').textContent  = myPts;
      const after = myPts - amount;
      const afterEl = document.getElementById('pay-after');
      afterEl.textContent = after < 0 ? '포인트 부족' : `⭐ ${after}점`;
      afterEl.style.color = after < 0 ? '#ef4444' : '#15803d';

      const btn = document.getElementById('pay-confirm-btn');
      btn.disabled = after < 0;
      btn.textContent = after < 0 ? '포인트 부족' : '💳 결제하기';

      document.getElementById('pay-confirm-wrap').style.display = 'block';
    }

    // 🧑‍🤝‍🧑 팀 결제 확인 화면 — 팀장만 가능, 팀당 1회
    async function showTeamPayConfirm(qrData) {
      const total = qrData.points || 0;
      // 내 팀 확인
      let myTeam = null, myPts = 0;
      try {
        const p = (await db.collection('participants').doc(nickname).get()).data();
        myTeam = p?.team || null; myPts = p?.points || 0;
      } catch(e) {}
      if (!myTeam) { showResult(false, '팀에 속해 있어야 팀 결제를 할 수 있어요.\n커뮤니티 → 팀순위에서 팀에 참여해주세요.'); return; }

      // 팀 설정 + 팀장 확인
      const tm = (await db.collection('config').doc('teamMode').get()).data();
      const team = (tm?.teams || []).find(t => t.id === myTeam);
      if (!tm?.enabled || !team) { showResult(false, '팀 게임이 활성화되지 않았어요.'); return; }
      if ((qrData.paidTeams || []).includes(myTeam)) {
        showResult(false, `${team.emoji || '🏆'} ${team.name} 팀은 이미 결제했어요!`);
        return;
      }
      if (team.leader && team.leader !== nickname) {
        showResult(false, `👑 팀장만 결제할 수 있어요.\n(${team.name} 팀장: ${team.leader})`);
        return;
      }

      // 팀원 수 조회 → 1/n 계산
      const membersSnap = await db.collection('participants').where('team', '==', myTeam).get();
      const count = membersSnap.size || 1;
      const per = Math.ceil(total / count);
      _payQR = qrData;
      _payTeamCtx = { teamId: myTeam, teamName: team.name, teamEmoji: team.emoji || '🏆', count, per };

      const teamLine = document.getElementById('pay-team-line');
      teamLine.style.display = 'block';
      teamLine.innerHTML = `${team.emoji || '🏆'} <b>${escHtml(team.name)}</b> 팀 ${count}명 · 1인당 ⭐ ${per}점<br>` +
        `<span style="font-weight:600; opacity:.85;">팀원 전원에게 각 ${per}점씩 차감돼요</span>`;
      document.getElementById('pay-amount-label').textContent = '총 결제 금액';
      document.getElementById('pay-after-label').textContent  = '내 결제 후 잔액';
      document.getElementById('pay-emoji').textContent  = qrData.emoji || '🧑‍🤝‍🧑';
      document.getElementById('pay-label').textContent  = qrData.label || '팀 결제';
      document.getElementById('pay-amount').textContent = `⭐ ${total}점`;
      document.getElementById('pay-mypts').textContent  = myPts;
      const after = myPts - per;
      const afterEl = document.getElementById('pay-after');
      afterEl.textContent = after < 0 ? '포인트 부족' : `⭐ ${after}점`;
      afterEl.style.color = after < 0 ? '#ef4444' : '#15803d';

      const btn = document.getElementById('pay-confirm-btn');
      btn.disabled = after < 0;
      btn.textContent = after < 0 ? '내 포인트 부족' : `🧑‍🤝‍🧑 팀 전체 결제하기`;

      document.getElementById('pay-confirm-wrap').style.display = 'block';
    }

    function cancelPay() {
      _payQR = null;
      _payTeamCtx = null;
      document.getElementById('pay-confirm-wrap').style.display = 'none';
      resetScanner();
    }

    async function confirmPay() {
      if (!_payQR || _paying) return;
      if (_payTeamCtx) { await confirmTeamPay(); return; }
      _paying = true;
      const qr = _payQR;
      const amount = payFinalAmount(qr);       // 할인 적용된 최종 금액
      const discount = Math.min(100, Math.max(0, qr.discount || 0));
      const btn = document.getElementById('pay-confirm-btn');
      btn.disabled = true; btn.textContent = '결제 중...';

      try {
        let newBalance = 0;
        await db.runTransaction(async tx => {
          const pRef = db.collection('participants').doc(nickname);
          const qRef = db.collection('qrcodes').doc(qr.id);
          const [pSnap, qSnap] = await Promise.all([tx.get(pRef), tx.get(qRef)]);
          if (!qSnap.exists || !qSnap.data().enabled) throw new Error('DISABLED');
          if (qr.oncePer && (qSnap.data().usedBy || []).includes(nickname)) throw new Error('ALREADY_PAID');
          const cur = pSnap.data()?.points || 0;
          if (cur < amount) throw new Error('INSUFFICIENT');
          newBalance = cur - amount;
          tx.update(pRef, { points: firebase.firestore.FieldValue.increment(-amount) });
          if (qr.oncePer) tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          // 결제 기록 (트랜잭션 내 생성 → 차감과 원자적)
          tx.set(db.collection('payments').doc(), {
            nickname, qrId: qr.id, label: qr.label || '결제',
            amount, discount, origPrice: qr.points || 0, paidAt: new Date().toISOString(),
          });
        });
        document.getElementById('pay-confirm-wrap').style.display = 'none';
        showResult(true, `✅ 결제 완료! ${qr.label || ''} -${amount}점\n남은 포인트: ⭐ ${newBalance}점`);
        if (navigator.vibrate) navigator.vibrate(100);
      } catch(e) {
        document.getElementById('pay-confirm-wrap').style.display = 'none';
        if (e.message === 'INSUFFICIENT')  showResult(false, '포인트가 부족해요.');
        else if (e.message === 'ALREADY_PAID') showResult(false, '이미 결제한 QR이에요. (1인 1회 제한)');
        else if (e.message === 'DISABLED') showResult(false, '사용이 중지된 결제 QR이에요.');
        else showResult(false, '결제 중 오류가 발생했어요. 다시 시도해주세요.');
      } finally {
        _paying = false;
        _payQR = null;
        btn.disabled = false; btn.textContent = '💳 결제하기';
      }
    }

    // 🧑‍🤝‍🧑 팀 결제 실행 — 팀원 전원 1/n 차감 (원자적)
    async function confirmTeamPay() {
      if (!_payQR || !_payTeamCtx || _paying) return;
      _paying = true;
      const qr = _payQR;
      const ctx = _payTeamCtx;
      const total = qr.points || 0;
      const btn = document.getElementById('pay-confirm-btn');
      btn.disabled = true; btn.textContent = '팀 결제 중...';

      try {
        // 최신 팀원 목록 재조회 (결제 시점 기준 1/n)
        const membersSnap = await db.collection('participants').where('team', '==', ctx.teamId).get();
        const memberRefs = membersSnap.docs.map(d => d.ref);
        const count = memberRefs.length;
        if (!count) throw new Error('NO_MEMBERS');
        const per = Math.ceil(total / count);

        await db.runTransaction(async tx => {
          const qRef = db.collection('qrcodes').doc(qr.id);
          const [qSnap, ...memberSnaps] = await Promise.all([tx.get(qRef), ...memberRefs.map(r => tx.get(r))]);
          if (!qSnap.exists || !qSnap.data().enabled) throw new Error('DISABLED');
          if ((qSnap.data().paidTeams || []).includes(ctx.teamId)) throw new Error('TEAM_PAID');

          // 포인트 부족 팀원 확인
          const poor = memberSnaps.find(s => (s.data()?.points || 0) < per);
          if (poor) throw new Error('POOR:' + (poor.data()?.nickname || poor.id));

          // 전원 차감 + 팀 결제 기록
          memberSnaps.forEach(s => tx.update(s.ref, { points: firebase.firestore.FieldValue.increment(-per) }));
          tx.update(qRef, { paidTeams: firebase.firestore.FieldValue.arrayUnion(ctx.teamId) });
          tx.set(db.collection('payments').doc(), {
            nickname, qrId: qr.id, label: qr.label || '팀 결제',
            amount: total, teamOrder: true,
            teamId: ctx.teamId, teamName: ctx.teamName,
            memberCount: count, perCost: per,
            paidAt: new Date().toISOString(),
          });
        });

        document.getElementById('pay-confirm-wrap').style.display = 'none';
        showResult(true, `🎉 ${ctx.teamEmoji} ${ctx.teamName} 팀 결제 완료!\n${qr.label || ''} 총 ${total}점 · ${count}명이 각 ${per}점씩 냈어요`);
        if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
      } catch(e) {
        document.getElementById('pay-confirm-wrap').style.display = 'none';
        const msg = e.message || '';
        if (msg.startsWith('POOR:'))       showResult(false, `😢 ${msg.slice(5)}님 포인트가 부족해서 결제할 수 없어요.\n(1인당 필요: ${Math.ceil(total / (ctx.count || 1))}점)`);
        else if (msg === 'TEAM_PAID')      showResult(false, '우리 팀은 이미 결제했어요!');
        else if (msg === 'DISABLED')       showResult(false, '사용이 중지된 결제 QR이에요.');
        else if (msg === 'NO_MEMBERS')     showResult(false, '팀원이 없어요.');
        else showResult(false, '팀 결제 중 오류가 발생했어요. 다시 시도해주세요.');
      } finally {
        _paying = false;
        _payQR = null;
        _payTeamCtx = null;
        btn.disabled = false; btn.textContent = '💳 결제하기';
      }
    }

    function resetScanner() {
      stopQRTimer();
      const resultEl = document.getElementById('qr-result');
      resultEl.className = 'qr-result';
      resultEl.style.display = 'none';
      document.getElementById('qr-quiz-wrap').style.display = 'none';
      document.getElementById('scan-again-wrap').style.display = 'none';
      document.getElementById('hint-box').style.display = 'none';
      document.getElementById('pay-confirm-wrap').style.display = 'none';
      currentQRCode = null;
      quizAnswered = false;
      qrAttempts = 0;
      _payQR = null;
      _payTeamCtx = null;
      processing = false;
      startScanner();
    }

    // URL에 ?code= 파라미터가 있으면 카메라 없이 바로 처리
    async function tryURLCode() {
      const code = new URLSearchParams(location.search).get('code');
      if (!code) { startScanner(); return; }

      document.getElementById('qr-reader').innerHTML =
        '<div style="text-align:center;padding:32px;color:#64748b;">🔍 QR 코드 확인 중...</div>';

      await handleQRCode(code);
    }

    // ── 카메라 종료 함수 ────────────────────────────
    async function stopCamera() {
      if (scanner) {
        try { await scanner.stop(); } catch(e) {}
        scanner = null;
      }
      // 남아있는 video 트랙 강제 종료 (iOS PiP 방지)
      document.querySelectorAll('video').forEach(v => {
        try {
          v.srcObject?.getTracks()?.forEach(t => t.stop());
          v.srcObject = null;
        } catch(e) {}
      });
    }

    async function stopScannerAndGoBack() {
      await stopCamera();
      window.location.href = 'map.html';
    }

    // 페이지 이탈 시 카메라 종료 (iOS PiP 방지)
    document.addEventListener('pagehide',       () => stopCamera());
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });
    window.addEventListener('beforeunload',      () => stopCamera());

    // 시작
    tryURLCode();

    // Service Worker 등록 (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
