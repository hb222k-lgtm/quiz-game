<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="탐험퀴즈">
  <title>QR 스캔 - 탐험 퀴즈 게임</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    body { background: linear-gradient(160deg, #0d0720 0%, #1a0a35 40%, #2d1060 100%); }
    /* html5-qrcode 기본 UI 숨기기 */
    #qr-reader__scan_region > img { display: none; }
    #qr-reader__dashboard_section_csr span { font-size: 13px !important; }
    #qr-reader__dashboard_section_fsr { display: none !important; }
    #qr-reader__header_message { display: none !important; }
    .page-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff; border: 1.5px solid var(--border);
      font-size: 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm); flex-shrink: 0;
      color: var(--text);
    }
    .page-header h2 { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
    .tips-card { background: var(--bg2); border-color: #c4b5fd; }
    .tips-card p { font-size: 13px; color: var(--primary); line-height: 1.8; font-weight: 600; }
    #qr-quiz-wrap .card {
      border-left: 4px solid var(--primary);
    }
    .quiz-label {
      font-size: 12px; color: var(--primary); font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    #qr-quiz-question {
      font-size: 16px; font-weight: 700; line-height: 1.6;
      margin-bottom: 16px; color: var(--text);
    }
    .qr-result { white-space: pre-line; }
    /* ── 30초 타이머 ── */
    #qr-timer-wrap {
      display: none; justify-content: center; align-items: center;
      margin: 8px 0; position: relative; height: 64px;
    }
    .timer-svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .timer-bg { fill: none; stroke: #e2e8f0; stroke-width: 3; }
    .timer-ring {
      fill: none; stroke: #7c3aed; stroke-width: 3;
      stroke-dasharray: 100 0; stroke-dashoffset: 25;
      stroke-linecap: round;
      transition: stroke-dasharray 1s linear, stroke 0.4s;
    }
    #qr-timer-count {
      position: absolute; font-size: 22px; font-weight: 900; color: #1e293b;
      transition: color 0.4s;
    }
    .result-explanation {
      display: block; margin-top: 6px; font-size: 13px; font-weight: 600; opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <button class="back-btn" onclick="stopScannerAndGoBack()">←</button>
      <h2>📷 QR 코드 스캔</h2>
    </div>

    <div class="card" style="padding:16px;">
      <p class="text-muted mb-8" style="text-align:center; font-size:13px; font-weight:600;">
        카메라에 QR 코드를 비춰주세요
      </p>
      <div id="qr-reader"></div>
    </div>

    <div class="qr-result" id="qr-result"></div>

    <!-- 퀴즈 QR 문제 영역 -->
    <div id="qr-quiz-wrap" style="display:none; margin-top:12px;">
      <div class="card">
        <div class="quiz-label">❓ 퀴즈 도전</div>
        <p id="qr-quiz-question"></p>
        <div id="qr-timer-wrap" style="display:none;">
          <svg class="timer-svg" viewBox="0 0 36 36">
            <circle class="timer-bg" cx="18" cy="18" r="15.9"/>
            <circle class="timer-ring" cx="18" cy="18" r="15.9" id="qr-timer-ring"/>
          </svg>
          <span id="qr-timer-count">30</span>
        </div>
        <div id="qr-quiz-options"></div>
      </div>
    </div>

    <div id="scan-again-wrap" style="display:none; margin-top:12px;">
      <button class="btn btn-outline" onclick="resetScanner()">🔄 다시 스캔하기</button>
    </div>

    <!-- QR 힌트 체인 -->
    <div id="hint-box" style="display:none; margin-top:14px; background:linear-gradient(135deg,#fef3c7,#fffbeb); border:2px solid #f59e0b; border-radius:16px; padding:14px 16px;">
      <div style="font-size:13px;font-weight:800;color:#92400e;margin-bottom:6px;">🔗 다음 힌트</div>
      <div id="hint-text" style="font-size:15px;font-weight:600;color:#1e293b;line-height:1.6;"></div>
    </div>

    <div class="card mt-16 tips-card">
      <p>
        📌 QR 코드는 1인당 1회만 스캔 가능해요<br>
        📌 카메라 접근 권한을 허용해야 해요<br>
        📌 밝은 곳에서 스캔하면 더 잘 인식돼요
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    const nickname = getNickname();
    if (!nickname) { window.location.href = 'index.html'; }

    let scanner = null;
    if (!nickname) { document.body.innerHTML = ''; } // redirect 후 실행 방지
    let processing = false;

    function startScanner() {
      scanner = new Html5Qrcode('qr-reader');

      // 후면 카메라 우선 시도 → 실패 시 전면/기본 카메라로 재시도
      // (일부 안드로이드·삼성 인터넷에서 environment 모드가 권한 오류 반환)
      scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      ).catch(() => {
        // 후면 카메라 실패 → 기본 카메라로 재시도
        scanner.start(
          { facingMode: 'user' },
          { fps: 10, qrbox: { width: 240, height: 240 } },
          onScanSuccess,
          () => {}
        ).catch(() => {
          // 모든 카메라 실패 → 에러 메시지
          const r = document.getElementById('qr-result');
          r.className = 'qr-result show error';
          r.textContent = '카메라를 사용할 수 없어요. HTTPS 접속 및 카메라 권한을 확인해주세요.';
          r.style.display = 'block';
        });
      });
    }

    let currentQRCode = null;
    let quizAnswered = false;
    let qrAttempts = 0;

    async function onScanSuccess(decodedText) {
      if (processing) return;
      processing = true;

      if (scanner) {
        await scanner.stop().catch(() => {});
        scanner = null;
      }

      let code = decodedText;
      try {
        const url = new URL(decodedText);
        code = url.searchParams.get('code') || decodedText;
      } catch {}

      await handleQRCode(code);
    }

    async function handleQRCode(code) {
      const resultEl = document.getElementById('qr-result');
      resultEl.style.display = 'block';
      resultEl.className = 'qr-result show';
      resultEl.textContent = '확인 중...';

      try {
        const qrSnap = await db.collection('qrcodes').doc(code).get();
        if (!qrSnap.exists) {
          showResult(false, '유효하지 않은 QR 코드예요.');
          return;
        }
        const qrData = { id: code, ...qrSnap.data() };

        if (!qrData.enabled) {
          showResult(false, '비활성화된 QR 코드예요.');
          return;
        }

        // 활성 기간 체크
        const now = new Date();
        if (qrData.startAt && new Date(qrData.startAt) > now) {
          const t = new Date(qrData.startAt).toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
          showResult(false, `⏳ 아직 활성화 전이에요.\n${t}부터 스캔 가능해요.`);
          return;
        }
        if (qrData.endAt && new Date(qrData.endAt) < now) {
          showResult(false, '⌛ 만료된 QR 코드예요.');
          return;
        }

        if ((qrData.usedBy || []).includes(nickname)) {
          showResult(false, '이미 스캔한 QR 코드예요.');
          return;
        }

        if (qrData.type === 'quiz') {
          resultEl.style.display = 'none';
          currentQRCode = qrData;

          // 문제 은행에서 랜덤 배정
          const bankSnap = await db.collection('quiz_bank').where('enabled', '==', true).get();
          const allQ = bankSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (!allQ.length) { showResult(false, '문제 은행이 비어있어요. 관리자에게 문의하세요.'); return; }

          // 이 QR에서 문제별 배정 횟수 조회 → 가장 덜 나온 문제 선택
          const statsSnap = await db.collection('qr_quiz_assignments').doc(code).get();
          const stats = statsSnap.exists ? statsSnap.data() : {};
          const chosen = allQ
            .map(q => ({ ...q, count: stats[q.id] || 0 }))
            .sort((a, b) => a.count - b.count || Math.random() - 0.5)[0];

          // parseInt(0)||100 이 100을 반환하는 버그 방지: nullish coalescing 사용
          const qrPts = qrData.quizPoints != null ? parseInt(qrData.quizPoints) : 100;
          qrData._quiz = { ...chosen, points: isNaN(qrPts) ? 100 : qrPts };
          showQRQuiz(qrData);

        } else if (qrData.type === 'minus') {
          // 📉 포인트 차감 (0점 아래로 내려가지 않음)
          const res = await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const pSnap = await tx.get(pRef);
            const cur = pSnap.data()?.points || 0;
            const deduct = qrData.points || 0;
            const newPts = Math.max(0, cur - deduct);
            tx.update(pRef, { points: newPts, scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
            return { deducted: cur - newPts };
          });
          showResult(false, `😱 ${qrData.label || 'QR'} 스캔! -${res.deducted}점... 다음엔 잘 골라요!`);

        } else if (qrData.type === 'double') {
          // 🎰 점수 2배
          const res = await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const pSnap = await tx.get(pRef);
            const cur = pSnap.data()?.points || 0;
            tx.update(pRef, { points: cur * 2, scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
            return { before: cur, after: cur * 2 };
          });
          showResult(true, `🎰 대박! 점수 2배! ${res.before}점 → ${res.after}점!`);

        } else if (qrData.type === 'half') {
          // ✂️ 점수 절반
          const res = await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const pSnap = await tx.get(pRef);
            const cur = pSnap.data()?.points || 0;
            const newPts = Math.floor(cur / 2);
            tx.update(pRef, { points: newPts, scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
            return { before: cur, after: newPts };
          });
          showResult(false, `✂️ 아이쿠! 점수 절반... ${res.before}점 → ${res.after}점`, 'warning');

        } else if (qrData.type === 'nothing') {
          // 💨 꽝!
          await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            tx.update(pRef, { scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          });
          showResult(false, `💨 꽝! 아무 일도 일어나지 않았어요 😅`, 'warning');

        } else if (qrData.type === 'team_mission') {
          // 🤝 팀 미션 QR — 같은 팀 N명 스캔 시 팀 전원 보너스
          const pSnap = await db.collection('participants').doc(nickname).get();
          const myTeam = pSnap.data()?.team;
          if (!myTeam) {
            showResult(false, '팀에 속하지 않으면 팀 미션을 스캔할 수 없어요.\n먼저 팀을 선택해주세요.');
            return;
          }
          const required = qrData.requiredMembers || 3;
          const bonus    = qrData.teamBonusPoints  || 200;

          const res = await db.runTransaction(async tx => {
            const qRef = db.collection('qrcodes').doc(code);
            const pRef = db.collection('participants').doc(nickname);
            const qSnap = await tx.get(qRef);
            const qd = qSnap.data() || {};
            if ((qd.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            const teamData = (qd.teamProgress || {})[myTeam] || { members: [], completed: false };
            if (teamData.completed) throw new Error('TEAM_DONE');
            if ((teamData.members || []).includes(nickname)) throw new Error('ALREADY_USED');
            const newCount = (teamData.members || []).length + 1;
            const isComplete = newCount >= required;
            const updates = {
              usedBy: firebase.firestore.FieldValue.arrayUnion(nickname),
              [`teamProgress.${myTeam}.members`]: firebase.firestore.FieldValue.arrayUnion(nickname),
            };
            if (isComplete) updates[`teamProgress.${myTeam}.completed`] = true;
            tx.update(qRef, updates);
            tx.update(pRef, { scannedQRs: firebase.firestore.FieldValue.arrayUnion(code) });
            return { count: newCount, required, isComplete };
          });

          if (res.isComplete) {
            // 팀 전원에게 보너스 지급 (골든타임 배율 적용)
            const mult = await getGoldenMultiplier();
            const finalBonus = Math.round(bonus * mult);
            const teamSnap = await db.collection('participants').where('team', '==', myTeam).get();
            const chunkSize = 500;
            for (let ci = 0; ci < teamSnap.docs.length; ci += chunkSize) {
              const batch = db.batch();
              teamSnap.docs.slice(ci, ci + chunkSize).forEach(d => {
                batch.update(d.ref, {
                  points:       firebase.firestore.FieldValue.increment(finalBonus),
                  earnedPoints: firebase.firestore.FieldValue.increment(finalBonus),
                });
              });
              await batch.commit();
            }
            const goldenMsg = mult > 1 ? ` (⚡ 골든타임 ×${mult})` : '';
            showResult(true, `🎉 팀 미션 완료! ${res.required}명 모두 스캔!\n팀 전원 +${finalBonus}점 지급됐어요!${goldenMsg}`);
            showHintBox(qrData.hint);
            const extras = ['team_player'];
            if (mult > 1) extras.push('golden');
            checkAndAwardBadges(nickname, extras).then(newBadges => showNewBadges(newBadges));
          } else {
            showResult(true, `✅ 스캔 완료! 우리 팀 ${res.count}/${res.required}명\n${res.required - res.count}명 더 스캔하면 팀 전원 +${bonus}점!`);
            showHintBox(qrData.hint);
            checkAndAwardBadges(nickname, ['team_player']).then(newBadges => showNewBadges(newBadges));
          }

        } else {
          // 💰 포인트 즉시 지급 — 트랜잭션 내에서 usedBy 재확인 (동시 스캔 중복 방지)
          const mult = await getGoldenMultiplier();
          const basePts = qrData.points || 0;
          const pts = Math.round(basePts * mult);
          await db.runTransaction(async tx => {
            const pRef = db.collection('participants').doc(nickname);
            const qRef = db.collection('qrcodes').doc(code);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            tx.update(pRef, {
              points:       firebase.firestore.FieldValue.increment(pts),
              earnedPoints: firebase.firestore.FieldValue.increment(pts),
              scannedQRs:   firebase.firestore.FieldValue.arrayUnion(code)
            });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          });
          const goldenMsg = mult > 1 ? ` (⚡ 골든타임 ×${mult})` : '';
          showResult(true, `"${qrData.label || 'QR 코드'}" 스캔 완료! +${pts}점 획득!${goldenMsg}`);
          showHintBox(qrData.hint);
          const extras = [];
          if (mult > 1) extras.push('golden');
          checkAndAwardBadges(nickname, extras).then(newBadges => showNewBadges(newBadges));
        }
      } catch (e) {
        if (e.message === 'ALREADY_USED') {
          showResult(false, '이미 스캔한 QR 코드예요.');
        } else if (e.message === 'TEAM_DONE') {
          showResult(false, '우리 팀이 이미 이 미션을 완료했어요! 🎉');
        } else {
          showResult(false, '오류가 발생했어요. 다시 시도해주세요.');
        }
      }
    }

    // ── QR 타이머 ──────────────────────────
    const QR_TIME = 30;
    let _qrTimerInterval = null;

    function startQRTimer(onTimeUp) {
      let sec = QR_TIME;
      const wrap = document.getElementById('qr-timer-wrap');
      wrap.style.display = 'flex';
      _updateQRTimerUI(sec);
      clearInterval(_qrTimerInterval);
      _qrTimerInterval = setInterval(() => {
        sec--;
        _updateQRTimerUI(sec);
        if (sec <= 0) { clearInterval(_qrTimerInterval); onTimeUp(); }
      }, 1000);
    }

    function stopQRTimer() {
      clearInterval(_qrTimerInterval);
      const wrap = document.getElementById('qr-timer-wrap');
      if (wrap) wrap.style.display = 'none';
    }

    function _updateQRTimerUI(sec) {
      const pct = Math.max(0, (sec / QR_TIME) * 100);
      const ring = document.getElementById('qr-timer-ring');
      const cnt  = document.getElementById('qr-timer-count');
      if (!ring || !cnt) return;
      ring.setAttribute('stroke-dasharray', `${pct} ${100 - pct}`);
      const color = sec <= 5 ? '#ef4444' : sec <= 10 ? '#f59e0b' : '#7c3aed';
      ring.setAttribute('stroke', color);
      cnt.textContent = sec;
      cnt.style.color = sec <= 5 ? '#ef4444' : sec <= 10 ? '#f59e0b' : '#1e293b';
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function handleQRTimeUp() {
      if (quizAnswered) return;
      quizAnswered = true;
      stopQRTimer();
      const quiz = currentQRCode?._quiz || currentQRCode?.quiz;
      if (!quiz) return;
      const btns = document.querySelectorAll('#qr-quiz-options button');
      btns.forEach(b => b.disabled = true);
      btns[quiz.correctIndex]?.classList.add('correct');
      const correctText = quiz.options?.[quiz.correctIndex] || '';
      const explanation = quiz.explanation || '';
      try {
        const qRef = db.collection('qrcodes').doc(currentQRCode.id);
        await db.runTransaction(async tx => {
          const qSnap = await tx.get(qRef);
          if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
          tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
        });
      } catch(e) { if (e.message !== 'ALREADY_USED') console.error(e); }
      const resultEl = document.getElementById('qr-result');
      resultEl.style.display = 'block';
      resultEl.className = 'qr-result show error';
      resultEl.innerHTML = `⏰ 시간 초과! 정답: <b>${escHtml(correctText)}</b>`
        + (explanation ? `<span class="result-explanation">${escHtml(explanation)}</span>` : '');
      document.getElementById('scan-again-wrap').style.display = 'block';
    }

    function showQRQuiz(qrData) {
      quizAnswered = false;
      const quiz = qrData._quiz || qrData.quiz;
      document.getElementById('qr-quiz-question').textContent = quiz.question;

      const optContainer = document.getElementById('qr-quiz-options');
      optContainer.innerHTML = '';
      (quiz.options || []).forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${['①','②','③','④'][i] || (i+1)+'.'} ${opt}`;
        btn.onclick = () => answerQRQuiz(i, qrData);
        optContainer.appendChild(btn);
      });

      document.getElementById('qr-quiz-wrap').style.display = 'block';
      startQRTimer(handleQRTimeUp);
    }

    async function answerQRQuiz(selected, qrData) {
      if (quizAnswered) return;
      stopQRTimer();

      const quiz = qrData._quiz || qrData.quiz;
      const btns = document.querySelectorAll('#qr-quiz-options button');
      const isCorrect = selected === quiz.correctIndex;
      const explanation = quiz.explanation || '';

      if (isCorrect) {
        quizAnswered = true;
        btns.forEach(b => b.disabled = true);
        btns[selected].classList.add('correct');

        try {
          const basePts = parseInt(quiz.points) || 0;
          const mult = await getGoldenMultiplier();
          const pts = Math.round(basePts * mult);
          await db.runTransaction(async tx => {
            const qRef = db.collection('qrcodes').doc(qrData.id);
            const qSnap = await tx.get(qRef);
            if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
            tx.update(db.collection('participants').doc(nickname), {
              points:       firebase.firestore.FieldValue.increment(pts),
              earnedPoints: firebase.firestore.FieldValue.increment(pts),
              scannedQRs:   firebase.firestore.FieldValue.arrayUnion(qrData.id)
            });
            tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
          });
          if (currentQRCode?.id && quiz.id) {
            db.collection('qr_quiz_assignments').doc(currentQRCode.id).set(
              { [quiz.id]: firebase.firestore.FieldValue.increment(1) }, { merge: true }
            ).catch(() => {});
          }
          const goldenMsg = mult > 1 ? ` (⚡×${mult})` : '';
          const resultEl = document.getElementById('qr-result');
          resultEl.style.display = 'block';
          resultEl.className = 'qr-result show success';
          resultEl.innerHTML = `🎉 정답! +${pts}점 획득!${goldenMsg}`
            + (explanation ? `<span class="result-explanation">${escHtml(explanation)}</span>` : '');
          document.getElementById('scan-again-wrap').style.display = 'block';
          showHintBox(qrData.hint);
          const extras = [];
          if (mult > 1) extras.push('golden');
          checkAndAwardBadges(nickname, extras).then(newBadges => showNewBadges(newBadges));
        } catch (e) {
          if (e.message === 'ALREADY_USED') showResult(false, '이미 처리된 QR 코드예요.');
          else showResult(false, '오류가 발생했어요: ' + e.message);
        }

      } else {
        qrAttempts++;
        btns[selected].classList.add('wrong');
        btns[selected].disabled = true;

        if (qrAttempts < 2) {
          const resultEl = document.getElementById('qr-result');
          resultEl.style.display = 'block';
          resultEl.className = 'qr-result show warning';
          resultEl.textContent = '😅 틀렸어요! 한 번 더 기회가 있어요.';
          startQRTimer(handleQRTimeUp); // 타이머 재시작 (2번째 도전)
          btns.forEach((b, i) => { if (i !== selected) b.disabled = false; });
        } else {
          quizAnswered = true;
          btns.forEach(b => b.disabled = true);
          btns[quiz.correctIndex].classList.add('correct');

          try {
            const qRef = db.collection('qrcodes').doc(qrData.id);
            await db.runTransaction(async tx => {
              const qSnap = await tx.get(qRef);
              if ((qSnap.data()?.usedBy || []).includes(nickname)) throw new Error('ALREADY_USED');
              tx.update(qRef, { usedBy: firebase.firestore.FieldValue.arrayUnion(nickname) });
            });
          } catch (e) {
            if (e.message !== 'ALREADY_USED') console.error('QR usedBy update error:', e);
          }
          const correctText = quiz.options?.[quiz.correctIndex] || '';
          const resultEl = document.getElementById('qr-result');
          resultEl.style.display = 'block';
          resultEl.className = 'qr-result show error';
          resultEl.innerHTML = `😢 아쉬워요! 정답: <b>${escHtml(correctText)}</b>`
            + (explanation ? `<span class="result-explanation">${escHtml(explanation)}</span>` : '');
          document.getElementById('scan-again-wrap').style.display = 'block';
        }
      }
    }

    function showResult(success, message, resultClass) {
      const resultEl = document.getElementById('qr-result');
      resultEl.style.display = 'block';
      resultEl.className = 'qr-result show ' + (resultClass || (success ? 'success' : 'error'));
      resultEl.textContent = message;
      document.getElementById('scan-again-wrap').style.display = 'block';
    }

    function showHintBox(hint) {
      const box = document.getElementById('hint-box');
      if (!hint || !box) return;
      document.getElementById('hint-text').textContent = hint;
      box.style.display = 'block';
    }

    function showNewBadges(newBadges) {
      if (!newBadges || !newBadges.length) return;
      newBadges.forEach((key, i) => {
        const info = ACHIEVEMENTS[key];
        if (!info) return;
        setTimeout(() => {
          showToast(`🏅 배지 획득! ${info.emoji} ${info.name} — ${info.desc}`);
        }, i * 1200);
      });
    }

    function resetScanner() {
      stopQRTimer();
      const resultEl = document.getElementById('qr-result');
      resultEl.className = 'qr-result';
      resultEl.style.display = 'none';
      document.getElementById('qr-quiz-wrap').style.display = 'none';
      document.getElementById('scan-again-wrap').style.display = 'none';
      document.getElementById('hint-box').style.display = 'none';
      currentQRCode = null;
      quizAnswered = false;
      qrAttempts = 0;
      processing = false;
      startScanner();
    }

    // URL에 ?code= 파라미터가 있으면 카메라 없이 바로 처리
    async function tryURLCode() {
      const code = new URLSearchParams(location.search).get('code');
      if (!code) { startScanner(); return; }

      document.getElementById('qr-reader').innerHTML =
        '<div style="text-align:center;padding:32px;color:#64748b;">🔍 QR 코드 확인 중...</div>';

      await handleQRCode(code);
    }

    // ── 카메라 종료 함수 ────────────────────────────
    async function stopCamera() {
      if (scanner) {
        try { await scanner.stop(); } catch(e) {}
        scanner = null;
      }
      // 남아있는 video 트랙 강제 종료 (iOS PiP 방지)
      document.querySelectorAll('video').forEach(v => {
        try {
          v.srcObject?.getTracks()?.forEach(t => t.stop());
          v.srcObject = null;
        } catch(e) {}
      });
    }

    async function stopScannerAndGoBack() {
      await stopCamera();
      window.location.href = 'map.html';
    }

    // 페이지 이탈 시 카메라 종료 (iOS PiP 방지)
    document.addEventListener('pagehide',       () => stopCamera());
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });
    window.addEventListener('beforeunload',      () => stopCamera());

    // 시작
    tryURLCode();

    // Service Worker 등록 (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
